name: NFSMW PRE648 V50 shader pass counters ARM64 native NO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre648_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre648-gpu-counter-native-noapk
  cancel-in-progress: false
jobs:
  counters-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python gate syntax and host C++ counter invariants
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre648_v50_shader_pass_counts_arm64_noapk.py
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            automation/kaggle/pre648_shader_counter_host_test.cpp \
            -Iautomation/kaggle -o /tmp/nfsmw-pre648-host
          /tmp/nfsmw-pre648-host
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests cryptography >/dev/null
      - name: Prepare pinned NDK 28.2.13676358 and CMake 3.31.6 only
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          NEED=()
          [ -f "$SDK/ndk/28.2.13676358/source.properties" ] || NEED+=("ndk;28.2.13676358")
          [ -x "$SDK/cmake/3.31.6/bin/cmake" ] || NEED+=("cmake;3.31.6")
          if [ "${#NEED[@]}" -gt 0 ]; then
            SDKMANAGER=""
            for q in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
              if [ -x "$q" ]; then SDKMANAGER="$q"; break; fi
            done
            test -n "$SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK" --install "${NEED[@]}" > /tmp/nfsmw-pre648-sdk.log 2>&1
            STATUS="${PIPESTATUS[1]}"
            set -o pipefail
            if [ "$STATUS" -ne 0 ]; then echo "PRE648_SDK_SETUP_FAILED=$STATUS"; exit "$STATUS"; fi
          fi
          test -x "$SDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          test -x "$SDK/cmake/3.31.6/bin/cmake"
          echo PRE648_ANDROID_NATIVE_TOOLCHAIN_READY
      - name: Replay signed V50 recipe, apply reversible counters to temporary tree, compile real PAL ARM64 ELF without APK
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          python automation/kaggle/pre648_v50_shader_pass_counts_arm64_noapk.py --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre648/PRE648_V50_SHADER_COUNTER_ARM64_NOAPK.json")
          j=json.loads(p.read_text())
          assert j["status"]=="AUDIT_OK",j.get("error_summary")
          assert j["evidence"]["pre648_counter_fixed_size_bytes"]==1638400
          assert j["evidence"]["pre648_source_exact_reverse_verified"] is True
          assert j["evidence"]["pre648_marker_linked_in_real_arm64_elf"] is True
          assert j["apk_created"] is False and j["signed"] is False
          assert j["fps_gain_proven"] is False
          print("PRE648_REAL_NATIVE_GATE=PASS")
          PY
      - name: Archive summary only (no source, Android APK, secrets or full game)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre648-v50-native-shader-counts-${{ github.run_id }}
          path: /tmp/nfsmw-pre648/PRE648_V50_SHADER_COUNTER_ARM64_NOAPK.json
          if-no-files-found: warn
          retention-days: 30
