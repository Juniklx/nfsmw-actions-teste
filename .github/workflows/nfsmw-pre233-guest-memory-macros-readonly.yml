name: NFSMW PRE233 guest-memory macro definitions and safety guard audit read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre233_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre233-guest-memory-macros
  cancel-in-progress: false
jobs:
  codegen-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google Drive client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve SHA-pinned PRE233 memory macro auditor from Drive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          svc=build("drive","v3",credentials=c,cache_discovery=False)
          buf=io.BytesIO();dl=MediaIoBaseDownload(buf,svc.files().get_media(fileId="1wnWxpDlKxtFMmiyIWYtXZnTyHVGczPqo"))
          done=False
          while not done:_,done=dl.next_chunk()
          data=buf.getvalue()
          if hashlib.sha256(data).hexdigest()!="801c7527fb3bf5b051d4279f2d73ead3110b8523d000eff5b48000e3db3f1efd":
            raise ValueError("Pinned PRE233 script digest mismatch")
          Path("/tmp/nfsmw_pre233_guest_memory_definitions_readonly.py").write_bytes(data)
          print("PRE233_SCRIPT_SHA_OK")
          PY
          python -m py_compile /tmp/nfsmw_pre233_guest_memory_definitions_readonly.py
      - name: Inspect authenticated guest memory macro definitions only, read-only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp:automation/kaggle python /tmp/nfsmw_pre233_guest_memory_definitions_readonly.py
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre233-guest-memory-${{ github.run_id }}
          path: /tmp/nfsmw-pre233/NFSMW_PRE233_GUEST_MEMORY_LAYOUT_MACROS.json
          if-no-files-found: warn
          retention-days: 14
