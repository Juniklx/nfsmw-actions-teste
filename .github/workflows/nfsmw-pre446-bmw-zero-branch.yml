name: NFSMW PRE446 BMW zero-branch provenance read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre446_requests/*.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe read-only audit requirements
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre446_bmw_zero_branch_readonly.py
      - name: Inspect authenticated PAL source return sites
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: PYTHONPATH=automation/kaggle python automation/kaggle/pre446_bmw_zero_branch_readonly.py --run-id "$GITHUB_RUN_ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre446-zero-branch-${{ github.run_id }}
          path: /tmp/nfsmw-pre446/report.json
          retention-days: 14
          if-no-files-found: warn
