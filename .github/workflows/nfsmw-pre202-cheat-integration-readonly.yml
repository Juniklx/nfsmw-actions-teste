name: NFSMW PRE202 - cheat integration architecture read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre202_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre202-cheat-integration
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup and validate readonly integration scanner
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre202_cheat_integration_readonly.py
      - name: Authenticate baseline PRE99 source and inspect interfaces
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          python automation/kaggle/pre202_cheat_integration_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save private integration audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre202-cheat-integration-readonly-${{ github.run_id }}
          path: /tmp/nfsmw-pre202/PRE202_INTEGRATION_READONLY.json
          if-no-files-found: warn
          retention-days: 14
