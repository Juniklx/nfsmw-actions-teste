name: NFSMW PRE339 verified passive Nitro context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre339_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre339-canonical-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated Drive sync
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre339_sync_passive_nitro_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup, verify, append and read back canonical context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre339_sync_passive_nitro_context.py
      - name: Archive bounded sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre339-context-status-${{ github.run_id }}
          path: /tmp/nfsmw-pre339/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sanitized status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE339 --report /tmp/nfsmw-pre339/CONTEXT_SYNC_STATUS.json
