name: NFSMW PRE515 trace compiled V48 Java game-root argument call references read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre515_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre515-original-v48-apk-markers
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Google Drive reader and syntax validation
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 androguard==4.1.3 >/dev/null
          python -m py_compile automation/kaggle/pre515_v48_dex_game_root_reference_readonly.py
      - name: Authenticate exact V48 signed APK; inspect compiled Java DEX selection methods without modification
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre515_v48_dex_game_root_reference_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Record evidence and block all runtime claims
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/nfsmw-pre515/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"stage":"PRE515","status":"FAILED_NO_REPORT"}
          for k in ("apk_or_game_resources_modified","dex_or_apk_contents_published",
                    "APK_built","save_modified","signing_key_accessed","BMW_tuning_usable"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE515 strict read-only boundary violated: "+k)
          if d.get("status")=="AUDIT_OK":
              for k in ("kernel_vfs_branch_executed_proven",
                        "BMW_runtime_VPAK_loaded",
                        "BMW_tuning_usable",
                        "selected_game_edition_runtime_proven"):
                  if d.get(k) is not False:
                      raise SystemExit("PRE515 binary search is not an in-game test")
              dest=Path("docs/PRE515_V48_DEX_GAME_ROOT_METHOD_REFS_READONLY.json")
          else:
              dest=Path("docs/PRE515_V48_DEX_GAME_ROOT_METHOD_REFS_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["BMW_tuning_usable"]=False
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE515_V48_DEX_GAME_ROOT_METHOD_REFS_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE515: authenticated original V48 DEX entrypoints"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Archive metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre515-v48-marker-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre515/report.json
          retention-days: 14
