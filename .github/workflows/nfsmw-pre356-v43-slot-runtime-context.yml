name: NFSMW PRE356 verified PRE355 V43 Nitro slot runtime context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre356_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre356-canonical-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated Drive sync
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre356_sync_v43_slot_runtime_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup, append verified PRE355 findings and read back context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre356_sync_v43_slot_runtime_context.py
      - name: Preserve bounded context sync status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre356-context-status-${{ github.run_id }}
          path: /tmp/nfsmw-pre356/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
      - name: Publish sanitized outcome
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE356 --report /tmp/nfsmw-pre356/CONTEXT_SYNC_STATUS.json
