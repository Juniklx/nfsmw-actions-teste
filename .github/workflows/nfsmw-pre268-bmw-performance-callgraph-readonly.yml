name: NFSMW PRE268 BMW PAL performance callgraph read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre268_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre268-bmw-callgraph
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated source reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Validate auditor syntax
        run: python -m py_compile automation/kaggle/pre268_pal_bmw_getmaxlevel_callgraph_readonly.py
      - name: Inspect pinned PAL guest function dataflow
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre268_pal_bmw_getmaxlevel_callgraph_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Archive sanitized structural report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre268-bmw-performance-callgraph-${{ github.run_id }}
          path: /tmp/nfsmw-pre268/PRE268_PAL_BMW_GETMAXLEVEL_CANDIDATES.json
          retention-days: 14
          if-no-files-found: warn
