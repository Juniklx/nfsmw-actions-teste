name: NFSMW PRE490 PAL guest function return and arguments audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre490_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre490-pal-return-args
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated source dependencies and syntax check
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre104_verify_backup_tar.py automation/kaggle/pre105_read_settings_source.py automation/kaggle/pre490_pal_function_argument_return_trace_readonly.py
      - name: PRE490 inspect bounded argument/return syntactic evidence, no changes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre490_pal_function_argument_return_trace_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save verified report or bounded failure diagnosis
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("/tmp/nfsmw-pre490/report.json")
          d=json.loads(f.read_text()) if f.is_file() else {"status":"FAILED_NO_REPORT"}
          if d.get("feature_enabled",False) is not False or d.get("apk_built",False) is not False or d.get("raw_generated_source_published",False) is not False:
              raise SystemExit("PRE490 safety invariant failed")
          if d.get("status")=="AUDIT_OK":
              if any(d.get("semantic_"+name+"_proven") is not False for name in ("GetMaxLevel","SetLevel","SetPackage")):
                  raise SystemExit("PRE490 cannot assert semantic identities")
              out=Path("docs/PRE490_PAL_FUNCTION_ARGS_RETURNS_READONLY.json")
          else:
              out=Path("docs/PRE490_PAL_FUNCTION_ARGS_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["feature_enabled"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE490_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE490: publish private PAL function ABI argument/return metadata"
          git push origin HEAD:main
      - name: Archive private sanitized audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre490-pal-guest-args-${{ github.run_id }}
          path: /tmp/nfsmw-pre490/report.json
          if-no-files-found: warn
          retention-days: 14
