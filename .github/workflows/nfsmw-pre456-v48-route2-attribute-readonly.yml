name: NFSMW PRE456 V48 route-2 attribute provenance read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre456_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre456-v48-attribute-origin
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Drive read dependencies and compile audit
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre456_v48_route2_attribute_origin_readonly.py
      - name: PRE456 authenticated PRE99 read-only static provenance
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre456_v48_route2_attribute_origin_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve static-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre456-static-attribute-provenance-${{ github.run_id }}
          path: /tmp/nfsmw-pre456-out/report.json
          if-no-files-found: warn
          retention-days: 14
