name: NFSMW PRE568 exact V48 Android save user-root and game-data-root DEX audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre568_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre568-v48-save-root-static-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare targeted audited V48 Android DEX probe
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth androguard loguru >/dev/null
          python -m py_compile automation/kaggle/pre568_v48_android_user_save_root_dex_readonly.py
      - name: Inspect V48 game-data versus user-root method references (no phone)
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre568_v48_android_user_save_root_dex_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Publish static evidence and enforce no save/root proof
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre568/report.json')
          r=json.loads(p.read_text()) if p.exists() else {"stage":"PRE568","status":"FAILED_NO_REPORT"}
          for k in ('actual_android_game_data_root_observed','actual_android_save_root_observed',
                    'save_profile_MARCEK_read','safe_disposable_profile_isolation_proven',
                    'same_package_separate_profile_testing_safe','guest_loader_executed','BMW_tuning_enabled',
                    'APK_built','original_apk_modified','save_modified','game_assets_modified',
                    'credential_accessed'):
              if r.get(k,False) is not False:raise SystemExit('PRE568 invalid runtime/write claim: '+k)
          if r.get('status')=='AUDIT_OK':
              if not (r.get('current_v48_native_user_root_method_exists') is True and
                      r.get('current_v48_game_data_root_method_exists') is True):
                  raise SystemExit('PRE568 source anchors missing')
              dest=Path('docs/PRE568_V48_ANDROID_SAVE_ROOT_STATIC_READONLY.json')
          else:
              dest=Path('docs/PRE568_V48_ANDROID_SAVE_ROOT_STATIC_DIAGNOSTIC.json')
              r={k:r.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in r}
              r['save_modified']=False
          dest.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE568_V48_ANDROID_SAVE_ROOT_STATIC_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE568: original signed V48 save root static DEX audit"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain only metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre568-v48-save-root-static
          path: /tmp/nfsmw-pre568/report.json
          retention-days: 14
