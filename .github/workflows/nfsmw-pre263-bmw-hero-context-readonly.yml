name: NFSMW PRE263 BMW HeroCar PAL branch contexts (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre263_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre263-bmw-readonly
  cancel-in-progress: false
jobs:
  function-xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated read-only backup client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check
        run: python -m py_compile automation/kaggle/pre263_bmw_hero_branch_context_readonly.py
      - name: Inspect PAL function bodies and calls without modifying sources
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre263_bmw_hero_branch_context_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Upload private bounded candidate body audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre263-hero-ui-xrefs-${{ github.run_id }}
          path: /tmp/nfsmw-pre263/PRE263_BMW_HERO_BRANCH_CONTEXT_READONLY.json
          if-no-files-found: warn
          retention-days: 14
