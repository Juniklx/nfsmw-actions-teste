name: NFSMW PRE569 V48 save-import method reference and path callgraph
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre569_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre569-v48-save-import-reference
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare static verified V48 save import path audit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth androguard loguru >/dev/null
          python -m py_compile automation/kaggle/pre569_v48_save_import_callgraph_readonly.py
      - name: Inspect call graph of exact original APK V48
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre569_v48_save_import_callgraph_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Enforce no save migration or runtime claim
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/nfsmw-pre569/report.json')
          r=json.loads(p.read_text()) if p.exists() else {"stage":"PRE569","status":"FAILED_NO_REPORT"}
          for k in ('partidas_method_actual_save_transfer_proven','V48_active_save_root_on_phone_observed','MARCEK_save_isolation_proven','guest_loader_executed','BMW_tuning_enabled','original_game_or_apk_modified','save_modified','signing_accessed'):
              if r.get(k,False) is not False:raise SystemExit("PRE569 invalid claim: "+k)
          if r.get('status')=='AUDIT_OK':
              if not r.get('partidas_method_present'):raise SystemExit("PRE569 traerPartidas absent")
              out=Path('docs/PRE569_V48_SAVE_IMPORT_STATIC_READONLY.json')
          else:
              out=Path('docs/PRE569_V48_SAVE_IMPORT_STATIC_DIAGNOSTIC.json')
              r={k:r.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in r}
              r['save_modified']=False
          out.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE569_V48_SAVE_IMPORT_STATIC_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE569: exact V48 save import and path static callgraph"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre569-save-import-static
          path: /tmp/nfsmw-pre569/report.json
          retention-days: 14
