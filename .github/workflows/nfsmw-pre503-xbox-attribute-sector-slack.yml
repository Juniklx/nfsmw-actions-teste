name: NFSMW PRE503 check original Xbox ZZDATA sector slack for rebuilt BMW attributes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre503_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre503-zzdata-padded-resource
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original Xbox ISO XDVDFS reader and scanner syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre503_pal_attributes_zzdata_sector_slack_readonly.py
      - name: Read-only verify resource padded 2KiB blocks, next entry and checksum fields
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre503_pal_attributes_zzdata_sector_slack_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Persist only allocation metadata and no binary resources
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre503/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          if any(d.get(k,False) is not False for k in ("tuning_enabled","APK_generated","modded_ZDIR_written","modded_ZZDATA_written","modded_GAME_resource_published")):
              raise SystemExit("PRE503 read-only safety condition violated")
          if d.get("status")=="AUDIT_OK":
              if d.get("VPAK_loader_accepts_larger_resource_verified") is not False:
                  raise SystemExit("Cannot claim loader acceptance from sector slack")
              out=Path("docs/PRE503_XBOX_ZZDATA_ATTRIBUTE_SECTOR_SLACK_READONLY.json")
          else:
              out=Path("docs/PRE503_XBOX_ATTRIBUTE_SECTOR_SLACK_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["tuning_enabled"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE503_XBOX_*SECTOR_SLACK*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE503: record original resource sector slack for prospective BMW attribute file"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
