name: NFSMW PRE231 USA money function and callee callgraph read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre231_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre231-money-callgraph
  cancel-in-progress: false
jobs:
  codegen-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google Drive client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve SHA-pinned PRE231 money callee analysis script from Drive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          svc=build("drive","v3",credentials=c,cache_discovery=False)
          buf=io.BytesIO();dl=MediaIoBaseDownload(buf,svc.files().get_media(fileId="1S2kATlo3t5UqWX3WbjKcvf-mZqcwUwB3"))
          done=False
          while not done:_,done=dl.next_chunk()
          data=buf.getvalue()
          if hashlib.sha256(data).hexdigest()!="da1703cd659cf543939fdbee383ab79f6ffdd11e7ac535c1f6adc8cf4bbb4d09":
            raise ValueError("Pinned PRE231 script digest mismatch")
          Path("/tmp/nfsmw_pre231_money_callgraph_calibration_readonly.py").write_bytes(data)
          print("PRE231_SCRIPT_SHA_OK")
          PY
          python -m py_compile /tmp/nfsmw_pre231_money_callgraph_calibration_readonly.py
      - name: Trace authenticated USA money and related call targets, read-only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp:automation/kaggle python /tmp/nfsmw_pre231_money_callgraph_calibration_readonly.py
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre231-money-callgraph-${{ github.run_id }}
          path: /tmp/nfsmw-pre231/NFSMW_PRE231_MONEY_ENTRY_AND_CALLEES.json
          if-no-files-found: warn
          retention-days: 14
