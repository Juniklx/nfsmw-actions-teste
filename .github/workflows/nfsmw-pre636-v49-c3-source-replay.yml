name: NFSMW PRE636 V49 authenticated source replay C3 only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre636_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre636-v49-c3-replay-noapk
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout audit code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only archive dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -m py_compile automation/kaggle/pre636_v49_c3_replay_noapk.py automation/kaggle/pre635_c3_duplicate_request_trace_dryrun.py
      - name: PRE636 verify full V49 source recipe in disposable tree (no NDK, no signing)
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: python automation/kaggle/pre636_v49_c3_replay_noapk.py
      - name: Preserve fail-closed JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre636-v49-c3-replay-${{ github.run_id }}
          path: /tmp/nfsmw-pre636/PRE636_V49_C3_REPLAY.json
          if-no-files-found: warn
          retention-days: 30
