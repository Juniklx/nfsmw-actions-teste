name: NFSMW PRE239 PAL money probe recipe read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre239_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre239-readonly
  cancel-in-progress: false
jobs:
  in-memory-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Drive authenticated read-only client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Python syntax check
        run: |
          python -m py_compile automation/kaggle/pre239_pal_money_probe_recipe_readonly.py
      - name: Authenticate PRE99, verify exact sites, dry-run insertion in memory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre239_pal_money_probe_recipe_readonly.py
      - name: Preserve JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre239-pal-money-probe-recipe-${{ github.run_id }}
          path: /tmp/nfsmw-pre239/NFSMW_PRE239_PAL_INJECTION_RECIPES.json
          if-no-files-found: warn
          retention-days: 14
