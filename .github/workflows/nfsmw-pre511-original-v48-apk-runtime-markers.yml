name: NFSMW PRE511 verify original V48 APK and native filesystem runtime symbols
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre511_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre511-original-v48-apk-markers
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Google Drive reader and syntax validation
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre511_v48_apk_native_runtime_marker_readonly.py
      - name: Authenticate exact V48 signed APK; inspect native library marker metadata without modification
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre511_v48_apk_native_runtime_marker_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Record evidence and block all runtime claims
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/nfsmw-pre511/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"stage":"PRE511","status":"FAILED_NO_REPORT"}
          for k in ("original_game_or_apk_modified","raw_apk_or_native_binary_uploaded",
                    "APK_built","save_modified","signing_key_accessed","tuning_enabled"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE511 strict read-only boundary violated: "+k)
          if d.get("status")=="AUDIT_OK":
              for k in ("actual_V48_runtime_mount_branch_observed",
                        "V48_VPAK_experiment_installed",
                        "ZDIR_checksum_algorithm_identified",
                        "BMW_tuning_available_or_bought"):
                  if d.get(k) is not False:
                      raise SystemExit("PRE511 binary search is not an in-game test")
              dest=Path("docs/PRE511_ORIGINAL_V48_APK_RUNTIME_MARKERS_READONLY.json")
          else:
              dest=Path("docs/PRE511_ORIGINAL_V48_APK_RUNTIME_MARKERS_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["tuning_enabled"]=False
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE511_ORIGINAL_V48_APK_RUNTIME_MARKERS_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE511: authenticated original V48 ELF string markers"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Archive metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre511-v48-marker-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre511/report.json
          retention-days: 14
