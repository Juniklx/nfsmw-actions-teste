name: NFSMW PRE738 - USA Catch-Up inheritance and RAM-only reversible candidate
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre738-catchup-ram-only.yml'
      - 'automation/actions_only/pre738_gameplay_inheritance.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/actions_only/pre738_gameplay_inheritance.py
      - name: Simulate five bool changes and exact reversal in ephemeral RAM only
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre738_gameplay_inheritance.py --report "$RUNNER_TEMP/pre738_analysis.json"
          echo 'PRE738=NO_PATCH_NO_APK_NO_SIGNING' >> "$GITHUB_STEP_SUMMARY"
