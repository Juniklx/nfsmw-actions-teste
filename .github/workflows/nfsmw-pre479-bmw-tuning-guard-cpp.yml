name: NFSMW PRE479 isolated BMW tuning C++ guard OFF-by-default
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre479_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre479-bmw-guard-cpp
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated C++ guard with Clang and GCC
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic automation/kaggle/bmw_tuning/pre479_bmw_guard_test.cpp -o /tmp/pre479_clang
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic automation/kaggle/bmw_tuning/pre479_bmw_guard_test.cpp -o /tmp/pre479_gcc
      - name: Verify BMW-only synthetic contract with two host compilers
        run: |
          set -euo pipefail
          /tmp/pre479_clang | tee /tmp/pre479_clang_report.txt
          /tmp/pre479_gcc | tee /tmp/pre479_gcc_report.txt
          grep -Fx 'PRE479_CPP_TESTS_PASSED=14' /tmp/pre479_clang_report.txt
          grep -Fx 'PRE479_CPP_TESTS_PASSED=14' /tmp/pre479_gcc_report.txt
          grep -Fx 'PRE479_RUNTIME_MOD_ENABLED=0' /tmp/pre479_clang_report.txt
          grep -Fx 'PRE479_RUNTIME_MOD_ENABLED=0' /tmp/pre479_gcc_report.txt
      - name: Record no-runtime-bridge pass
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r={"stage":"PRE479_BMW_TUNING_CPP_GUARD_OFF_BY_CONSTRUCTION",
             "status":"AUDIT_OK","run_id":os.getenv("GITHUB_RUN_ID"),
             "compilers":["clang++ C++17","g++ C++17"],
             "host_guard_tests_each_compiler":14,
             "reality":"offline synthetic guard only; no game integration",
             "feature_enabled":False,
             "runtime_hook_installed":False,
             "save_modified":False,
             "apk_built":False,
             "nitro_pre398_preserved":True,
             "catalog_and_BMW_custom_profiles_not_yet_verified":True}
          path=Path("docs/PRE479_BMW_TUNING_CPP_GUARD_OFF.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE479_BMW_TUNING_CPP_GUARD_OFF.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE479: record C++ offline BMW mod guard tests (runtime OFF)"
          git push origin HEAD:main
