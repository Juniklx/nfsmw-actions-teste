name: NFSMW PRE447 default-OFF guest return route dryrun
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre447_requests/*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre447_bmw_lookup_route_probe_dryrun.py
      - name: Verify the off-by-default reversible in-memory preview
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: PYTHONPATH=automation/kaggle python automation/kaggle/pre447_bmw_lookup_route_probe_dryrun.py --run-id "$GITHUB_RUN_ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre447-route-preview-${{ github.run_id }}
          path: /tmp/nfsmw-pre447/report.json
          retention-days: 14
          if-no-files-found: warn
