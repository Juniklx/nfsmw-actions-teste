name: NFSMW PRE335 backup and sync verified Nitro context to Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre335_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre335-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated Drive updater
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre335_sync_nitro_actions_kaggle_context.py
      - name: Verify, backup, append and read back canonical context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre335_sync_nitro_actions_kaggle_context.py
      - name: Archive context sync status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre335-context-readback-${{ github.run_id }}
          path: /tmp/nfsmw-pre335/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sanitized sync result to GitHub
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE335 --report /tmp/nfsmw-pre335/CONTEXT_SYNC_STATUS.json
