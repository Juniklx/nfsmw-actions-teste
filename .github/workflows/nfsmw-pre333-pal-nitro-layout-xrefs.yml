name: NFSMW PRE333 authenticated PAL Nitro layout xrefs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre333_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre333-nitro-layout
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and synthetic structural invariants
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre333_pal_nitro_layout_xrefs_readonly.py automation/kaggle/pre333_pal_nitro_layout_xrefs_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre333_pal_nitro_layout_xrefs_mock.py
      - name: Install authenticated Drive client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Verify PRE99 and scan generated PAL functions
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre333_pal_nitro_layout_xrefs_readonly.py
      - name: Archive candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre333-pal-nitro-layout-${{ github.run_id }}
          path: /tmp/nfsmw-pre333/PRE333_NITRO_LAYOUT_XREFS.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish allowlisted status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE333 --report /tmp/nfsmw-pre333/PRE333_NITRO_LAYOUT_XREFS.json
