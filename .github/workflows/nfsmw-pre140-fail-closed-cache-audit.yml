name: NFSMW PRE140 verify split-cache security gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre140_policy_requests/*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse optimized V31 build script and production workflow
        run: |
          python -m pip install --disable-pip-version-check PyYAML >/dev/null
          python -m py_compile \
            automation/kaggle/pre138_build_signed_v31_log_pal_usa.py \
            automation/kaggle/pre139_verify_dependency_cache.py \
            automation/kaggle/pre140_verify_fail_closed_cache.py
          python automation/kaggle/pre140_verify_fail_closed_cache.py \
            > /tmp/pre140-cache-failclosed-policy.json
          python -m json.tool /tmp/pre140-cache-failclosed-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: pre140-cache-failclosed-policy-${{ github.run_id }}
          path: /tmp/pre140-cache-failclosed-policy.json
          retention-days: 14
