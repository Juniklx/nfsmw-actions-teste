name: NFSMW PRE234 generated PCH guest memory macro and safety audit read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre234_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre234-guest-pch-memory
  cancel-in-progress: false
jobs:
  codegen-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google Drive client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve SHA-pinned PRE234 generated PCH auditor from Drive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          svc=build("drive","v3",credentials=c,cache_discovery=False)
          buf=io.BytesIO();dl=MediaIoBaseDownload(buf,svc.files().get_media(fileId="1o9Nc268ksnzuQLu7X0FN5wHDAnyDpB5Q"))
          done=False
          while not done:_,done=dl.next_chunk()
          data=buf.getvalue()
          if hashlib.sha256(data).hexdigest()!="19010ec1951d221270ef07702fc26a542df79c9f9a559031642013289bb1075f":
            raise ValueError("Pinned PRE234 script digest mismatch")
          Path("/tmp/nfsmw_pre234_pch_memory_layout_readonly.py").write_bytes(data)
          print("PRE234_SCRIPT_SHA_OK")
          PY
          python -m py_compile /tmp/nfsmw_pre234_pch_memory_layout_readonly.py
      - name: Audit authenticated PAL and USA PCH guest memory macros, read-only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp:automation/kaggle python /tmp/nfsmw_pre234_pch_memory_layout_readonly.py
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre234-guest-pch-memory-${{ github.run_id }}
          path: /tmp/nfsmw-pre234/NFSMW_PRE234_PCH_MEMORY_SAFETY.json
          if-no-files-found: warn
          retention-days: 14
