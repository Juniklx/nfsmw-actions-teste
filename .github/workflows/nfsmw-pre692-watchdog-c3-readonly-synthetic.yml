name: NFSMW PRE692 - C3 duplicate and watchdog readonly synthetic test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/run_requests/PRE692_WATCHDOG_C3_*.txt"
permissions:
  contents: read
jobs:
  c3_watchdog:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main' && github.actor == 'Juniklx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate analyzer read-only and synthetic timeline assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          script=automation/kaggle/pre692_c3_watchdog_log_readonly.py
          python3 -m py_compile "$script"
          if grep -En '(subprocess|os.system|ctypes|adb shell|setprop|extractall|eval\(|exec\()' "$script"; then
            echo PRE692_UNSAFE_SOURCE_API=TRUE
            exit 10
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export MOCK_DIR="$tmp"
          python3 - <<'PY'
          import os
          from pathlib import Path
          d=Path(os.environ['MOCK_DIR'])
          def L(ts,level,msg):
              return f'[{ts}] [{level}] [core] [t100] {msg}'
          trace='[NFSMW_PRE635_C3_TWOREQUEST_TRACE] indice=0 en_vuelo=1 frame={f} textura_frame={f} epoca_ahora={f} epoca_primera={f} offset_primera=0 offset_segunda=51872 mismos_comandos=true subir=true trabajo_huella=0 datos_bytes=43648'
          guard='[nativo] C3: hilo de enlaces de texturas APAGADO [NFSMW_PRE194_C3 indice_fuera=false referencia_distinta=false copia_duplicada=true]'
          rows=[
            L('2026-11-11 10:00:00.000','info','[ajustes] resolucion interna 1920x1080 y limite de FPS 120: modo'),
            L('2026-11-11 10:00:01.000','info','Vulkan: driver propio cargado con adrenotools: /mock/vulkan.radeon.so'),
            L('2026-11-11 10:00:25.000','info',trace.format(f=2291)),
            L('2026-11-11 10:00:25.000','error',guard),
            L('2026-11-11 10:10:29.000','info','[ajustes] resolucion interna 1920x1080 y limite de FPS 60: modo'),
            L('2026-11-11 10:10:30.000','info','Vulkan: driver propio cargado con adrenotools: /mock/vulkan.radeon.so'),
            L('2026-11-11 10:10:42.000','error','[vigilante] 5 s sin que se mueva ni un registro'),
            L('2026-11-11 10:10:57.000','error','[vigilante] 20 s sin que se mueva ni un registro'),
            L('2026-11-11 10:11:10.000','warning','[vigilante] el juego ha vuelto a moverse despues de 31 s parado'),
            L('2026-11-11 10:11:12.000','info',trace.format(f=1766)),
            L('2026-11-11 10:11:12.000','error',guard),
            L('2026-11-11 10:13:00.000','error','[vigilante] 5 s sin que se mueva ni un registro'),
          ]
          (d/'synthetic.log').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          (d/'synthetic_present.txt').write_text(
            'COLLECTION_START=2026-11-11T10:12:00-0300\n'
            'COLLECTION_END=2026-11-11T10:12:39-0300\n',encoding='utf-8')
          PY
          python3 "$script" "$tmp/synthetic.log" --capture "$tmp/synthetic_present.txt" --output "$tmp/report.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['MOCK_DIR'])/'report.json').read_text())
          assert j['session_count']==2,j
          assert j['unique_pre635_signatures']==1,j
          assert j['all_traces_paired'] is True,j
          assert [s['fps_cap'] for s in j['sessions']]==[120,60],j
          assert [s['driver'] for s in j['sessions']]==['RADV_XCLIPSE']*2,j
          s=j['sessions'][1]
          assert s['watchdog_episode_count']==2,s
          assert s['recovered_count']==1 and s['open_count']==1,s
          assert s['watchdog_episodes'][0]['reported_stall_s']==31,s
          assert s['watchdog_episodes'][0]['alert_preceded_first_c3_guard'] is True,s
          assert s['watchdog_episodes'][1]['complete'] is False,s
          assert j['capture_window']['c3_guards_during']==0,j
          assert j['capture_window']['watchdog_first_alerts_during']==0,j
          assert all(t['same_epoch'] and t['same_frame'] for ss in j['sessions'] for t in ss['pre635_traces'])
          print("PRE692_SYNTHETIC_C3_AND_WATCHDOG_TIMELINE=PASS")
          print("PRE692_ONE_5S_20S_RECOVERY_EQUALS_ONE_EPISODE=PASS")
          print("PRE692_PRE_C3_FREEZE_AND_OPEN_TAIL_GUARDS=PASS")
          print("PRE692_DEVICE_LOG_WAS_NOT_UPLOADED=TRUE")
          print("PRE692_REAL_GALAXY_RUNTIME=NOT_TESTED_IN_CI")
          PY
