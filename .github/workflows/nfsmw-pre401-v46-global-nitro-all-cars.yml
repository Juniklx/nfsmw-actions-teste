name: NFSMW PRE401 - signed V46 global Nitro full all cars experimental
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre401_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre401-v46-global-nitro-isolated
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies and validate scripts
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile \
            automation/kaggle/pre104_verify_backup_tar.py \
            automation/kaggle/pre105_read_settings_source.py \
            automation/kaggle/pre107_restore_isolated.py \
            automation/kaggle/pre117_one_scroll_android_dryrun.py \
            automation/kaggle/pre118_audit_build_tree.py \
            automation/kaggle/pre125_ephemeral_gradle_signing_preflight.py \
            automation/kaggle/pre127_apk_v2_certificate_audit.py \
            automation/kaggle/pre128_android_touch_scroll_visual_patch.py \
            automation/kaggle/pre131_native_touch_and_modern_ui_patch.py \
            automation/kaggle/pre133_mouse_bridge_swipe_patch.py \
            automation/kaggle/pre157_otimizar_refresh_callback.py \
            automation/kaggle/pre165_sdl_wake_sleep2.py \
            automation/kaggle/pre170_input_pump_8ms_patch.py \
            automation/kaggle/pre180_android_sdl_wait_block_patch.py \
            automation/kaggle/pre194_c3_guard_pal_diagnostic_patch.py \
            automation/kaggle/pre194_build_signed_v36_c3_pal_diag.py \
            automation/kaggle/pre139_verify_dependency_cache.py \
            automation/kaggle/pre140_guard_sdk_only_ccache.py \
            automation/kaggle/pre246_passive_money_probe_patch.py \
            automation/kaggle/pre247_pal_meter_passive_probe_patch.py \
            automation/kaggle/pre317_nitro_cycle_staging.py \
            automation/kaggle/pre316_nitro_cycle_monitor_mock.py \
            automation/kaggle/pre317_nitro_cycle_staging_mock.py \
            automation/kaggle/pre246_build_signed_v37_passive_money_trace.py \
            automation/kaggle/pre284_v37_full_passive_vtable_link_preflight.py \
            automation/kaggle/pre291_bmw_main_menu_passive_trace_dryrun.py \
            automation/kaggle/pre292_bmw_main_menu_native_link_nosign.py \
            automation/kaggle/pre401_build_signed_v46_global_nitro_full.py
          python automation/kaggle/pre139_verify_dependency_cache.py --self-test
      - name: PRE305B fail-closed BMW C++ macro synthetic regression gate
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre305b_gate_macro_preflight.py
          python automation/kaggle/pre305b_gate_macro_preflight.py
      - name: PRE318 fail-closed passive Nitro cycle C++ canary
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre316_nitro_cycle_monitor_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre317_nitro_cycle_staging_mock.py
      - name: PRE340 C++ passive object diversity regression
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Iautomation/kaggle automation/kaggle/pre336_nitro_address_diversity_mock.cpp -o /tmp/pre340_diversity_mock
          /tmp/pre340_diversity_mock
      - name: PRE340 composite passive callback compile and reversible staging gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre337_nitro_diversity_staging.py automation/kaggle/pre338_nitro_composite_native_compile_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre337_nitro_diversity_staging_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre338_nitro_composite_native_compile_mock.py
      - name: PRE352 per-slot Nitro value C++ regression
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Iautomation/kaggle automation/kaggle/pre348_nitro_slot_values_mock.cpp -o /tmp/pre352-nitro-slot-mock
          /tmp/pre352-nitro-slot-mock
      - name: PRE352 reversible PRE349 staging and composite host syntax gate
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre349_nitro_slot_value_staging.py automation/kaggle/pre349_nitro_slot_value_staging_mock.py automation/kaggle/pre350_nitro_slot_values_composite_compile_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre349_nitro_slot_value_staging_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre350_nitro_slot_values_composite_compile_mock.py
      - name: PRE367 XInput user0 host-only reversible marker regression
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre364_xinput_user0_passive_staging.py automation/kaggle/pre364_xinput_user0_passive_mock.py automation/kaggle/pre401_build_signed_v46_global_nitro_full.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre364_xinput_user0_passive_mock.py
      - name: PRE390 native host LR-slot callback and exact reversal regression
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre379_nitro_lr_entry_staging.py automation/kaggle/pre383_nitro_lr_slot_callback_staging.py automation/kaggle/pre384_nitro_lr_slot_host_compile.py automation/kaggle/pre389_nitro_lr_slot_staging.py automation/kaggle/pre401_build_signed_v46_global_nitro_full.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre384_nitro_lr_slot_host_compile.py
      - name: PRE399 global Nitro all-cars synthetic fail-closed canary
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre398_global_nitro_full_staging.py automation/kaggle/pre399_global_nitro_source_canary.py automation/kaggle/pre401_build_signed_v46_global_nitro_full.py
          PYTHONPATH=automation/kaggle python -c "from pre399_global_nitro_source_canary import synthetic; synthetic(); print('PRE401_GLOBAL_NITRO_SYNTHETIC_OK')"
      - name: Prepare exact Android NDK CMake and SDK build tools in ephemeral runner
        id: android_tools
        continue-on-error: true
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "PRE194 preparing Android SDK tools; no game source or key accessed in this step"
          SDKMANAGER=""
          for p in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          test -n "$SDKMANAGER"
          # PRE139: check pinned versions and install ONLY genuinely missing tools.
          # Do not delete other NDKs. Each hosted runner is ephemeral anyway.
          MISSING=()
          [ -f "$SDK/ndk/28.2.13676358/source.properties" ] || MISSING+=("ndk;28.2.13676358")
          [ -d "$SDK/cmake/3.31.6" ] || MISSING+=("cmake;3.31.6")
          [ -f "$SDK/platforms/android-36/android.jar" ] || MISSING+=("platforms;android-36")
          [ -f "$SDK/build-tools/36.0.0/apksigner" ] || MISSING+=("build-tools;36.0.0")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "PRE139 SDK packages missing: ${#MISSING[@]}"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK" --install "${MISSING[@]}" \
              > /tmp/nfsmw-pre180-sdk-install.log 2>&1
            EXIT="${PIPESTATUS[1]}"
            set -o pipefail
            if [ "$EXIT" -ne 0 ]; then echo "PRE139 SDK install failed, exit=$EXIT"; exit "$EXIT"; fi
          else
            echo "PRE139 all pinned SDK tools already present; skipping SDK installer"
          fi
          test -f "$SDK/ndk/28.2.13676358/source.properties"
          test -d "$SDK/cmake/3.31.6"
          test -f "$SDK/build-tools/36.0.0/apksigner"
          test -f "$SDK/build-tools/36.0.0/aapt"
          echo "PRE194 ephemeral NDK/CMake/build-tools ready"
          df -h "$SDK" | tail -n 1
      - name: PRE140 locate or install ccache and validate SDK-only launcher
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq ccache >/dev/null
          fi
          ccache --version | head -1
          chmod 755 automation/kaggle/pre140_sdk_only_ccache_launcher.sh
          bash -n automation/kaggle/pre140_sdk_only_ccache_launcher.sh
      - name: PRE139 restore dependency-only Gradle cache
        uses: actions/cache/restore@v4
        id: gradle_deps_cache
        with:
          path: |
            ${{ runner.temp }}/nfsmw-gradle-home/caches/modules-2
            ${{ runner.temp }}/nfsmw-gradle-home/wrapper
          key: nfsmw-pre99-gradle-ef570ba95703-jdk21-v1-${{ runner.os }}
      - name: PRE140 verify restored Gradle cache before build
        if: steps.gradle_deps_cache.outputs.cache-hit == 'true'
        run: |
          python automation/kaggle/pre139_verify_dependency_cache.py \
            --cache-home "${{ runner.temp }}/nfsmw-gradle-home"
      - name: PRE140 report cache restore status
        env:
          GRADLE_CACHE_HIT: ${{ steps.gradle_deps_cache.outputs.cache-hit }}
        run: |
          echo "Gradle dependency cache hit: ${GRADLE_CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Only modules-2 and wrapper; no game assets, signing data, native outputs." >> "$GITHUB_STEP_SUMMARY"
      - name: PRE140 restore pinned SDK-only compiler cache
        id: sdk_ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nfsmw-ccache-sdk-only
          key: nfsmw-pre99-sdkonly-ndk28-clang-ccache4-v1-${{ runner.os }}
      - name: PRE140 inspect restored SDK compiler cache before build
        if: steps.sdk_ccache.outputs.cache-hit == 'true'
        run: |
          python automation/kaggle/pre140_guard_sdk_only_ccache.py \
            --mode check \
            --cache-dir "${{ runner.temp }}/nfsmw-ccache-sdk-only"
      - name: Build V46 signed global Nitro full all cars experimental and verify permanent certificate and both ELF markers
        id: release
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NFSMW_GRADLE_USER_HOME: ${{ runner.temp }}/nfsmw-gradle-home
          NFSMW_PRE140_CCACHE_LAUNCHER: ${{ github.workspace }}/automation/kaggle/pre140_sdk_only_ccache_launcher.sh
          CCACHE_DIR: ${{ runner.temp }}/nfsmw-ccache-sdk-only
        run: |
          set -e
          test "${{ steps.android_tools.outcome }}" = "success"
          mkdir -p /tmp/nfsmw-pre401-out
          python automation/kaggle/pre401_build_signed_v46_global_nitro_full.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre401-out/pre401-v46-report.json \
            --verified-output /tmp/nfsmw-pre401-out/nfsmw-v46-global-nitro-all-cars-verified.apk \
            --upload
      - name: PRE139 verify dependency-only cache contents before GitHub cache save
        id: deps_policy
        if: steps.release.outcome == 'success'
        run: |
          python automation/kaggle/pre139_verify_dependency_cache.py \
            --cache-home "${{ runner.temp }}/nfsmw-gradle-home" \
            --report /tmp/nfsmw-pre401-out/pre139-safe-cache-report.json
      - name: PRE140 persist audited Gradle dependency cache only after successful gate
        if: ${{ success() && steps.release.outcome == 'success' && steps.deps_policy.outcome == 'success' && steps.gradle_deps_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/nfsmw-gradle-home/caches/modules-2
            ${{ runner.temp }}/nfsmw-gradle-home/wrapper
          key: ${{ steps.gradle_deps_cache.outputs.cache-primary-key }}
      - name: PRE140 seal SDK-only compiler cache after fully verified release
        id: sdk_ccache_policy
        if: steps.release.outcome == 'success'
        run: |
          python automation/kaggle/pre140_guard_sdk_only_ccache.py \
            --mode seal \
            --cache-dir "${{ runner.temp }}/nfsmw-ccache-sdk-only" \
            --report /tmp/nfsmw-pre401-out/pre140-safe-sdk-cache.json
      - name: PRE140 save verified SDK compiler cache only on successful release
        if: ${{ success() && steps.release.outcome == 'success' && steps.sdk_ccache_policy.outcome == 'success' && steps.sdk_ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nfsmw-ccache-sdk-only
          key: ${{ steps.sdk_ccache.outputs.cache-primary-key }}
      - name: Preserve private report and verified APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre401-v46-global-nitro-all-cars-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre401-out/pre401-v46-report.json
            /tmp/nfsmw-pre401-out/nfsmw-v46-global-nitro-all-cars-verified.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Require fully validated and permanently signed V46 global Nitro all cars experimental
        if: always()
        env:
          PRE194_BUILD: ${{ steps.release.outcome }}
        run: test "$PRE194_BUILD" = success
