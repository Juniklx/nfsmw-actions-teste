name: NFSMW PRE264 BMW PAL hero menu localized patch dry-run (no APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre264_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre264-bmw-patch-dryrun
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated read-only backup client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Python syntax gate
        run: python -m py_compile automation/kaggle/pre264_bmw_hero_menu_patch_dryrun.py
      - name: Pin and test memory-only BMW customize main menu patch
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre264_bmw_hero_menu_patch_dryrun.py --run-id "$GITHUB_RUN_ID"
      - name: Archive audit metadata only (never source/app/save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre264-bmw-patch-dryrun-${{ github.run_id }}
          path: /tmp/nfsmw-pre264/PRE264_BMW_PAL_UI_PATCH_DRYRUN.json
          if-no-files-found: warn
          retention-days: 14
