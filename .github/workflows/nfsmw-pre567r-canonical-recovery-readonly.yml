name: NFSMW PRE567R independent canonical Drive recovery verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre567r_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre567r-readonly-recovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare independent Drive recovery readback
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre567r_drive_canonical_recovery_readonly.py
      - name: Check both PRE567 backups and byte-exact canonical append
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre567r_drive_canonical_recovery_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Publish metadata report only, never change canonical context
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/nfsmw-pre567r/report.json')
          d=json.loads(p.read_text()) if p.exists() else {'stage':'PRE567R','status':'FAILED_NO_REPORT'}
          for k in ('canonical_or_backup_files_modified_by_PRE567R','APK_built','game_assets_modified','save_modified','signing_material_accessed','BMW_tuning_enabled'):
              if d.get(k,False) is not False: raise SystemExit('Prohibited PRE567R side effect: '+k)
          if d.get('status')=='AUDIT_OK' and not all(d.get(k) is True for k in
              ('canonical_append_matches_pinned_gitHub_handoff','original_context_prefix_preserved','canonical_postreadback_verified')):
              raise SystemExit('PRE567R readback not proven')
          dest=Path('docs/PRE567R_DRIVE_RECOVERY_READONLY_RESULT.json')
          dest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE567R_DRIVE_RECOVERY_READONLY_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE567R: verify canonical Drive append after GitHub report failure"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain sanitized recovery metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre567r-canonical-recovery
          path: /tmp/nfsmw-pre567r/report.json
          retention-days: 14
