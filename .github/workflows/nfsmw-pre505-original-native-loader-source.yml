name: NFSMW PRE505 read-only historical native game asset loading source survey
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre505_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre505-original-native-loader-source
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated private Drive reader and check syntax
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre505_pre99_native_asset_loader_paths_readonly.py
      - name: Read PRE99 verified snapshot to find first-party file and asset loader paths
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre505_pre99_native_asset_loader_paths_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Verify safety fields and persist sanitized metadata only
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("/tmp/nfsmw-pre505/report.json")
          d=json.loads(f.read_text()) if f.is_file() else {"status":"FAILED_NO_REPORT"}
          for k in ("game_source_exported","game_assets_exported","modified_VPAK_written",
                    "APK_built","save_modified","signing_accessed","tuning_enabled"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE505 read-only safety field unexpectedly true: "+k)
          if d.get("status")=="AUDIT_OK":
              if (d.get("active_V48_loader_or_live_bundle_verified") is not False or
                  d.get("BMW_new_ExpN_resolution_in_runtime_verified") is not False):
                  raise SystemExit("PRE505 cannot promote PRE99 to runtime V48 proof")
              output=Path("docs/PRE505_PRE99_NATIVE_ASSET_LOADER_PATHS_READONLY.json")
          else:
              output=Path("docs/PRE505_PRE99_NATIVE_LOADER_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["tuning_enabled"]=False
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE505_PRE99_NATIVE_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE505: capture historical native loader code routing evidence"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Archive sanitized report even if publish fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre505-native-loader-${{ github.run_id }}
          path: /tmp/nfsmw-pre505/report.json
          retention-days: 14
