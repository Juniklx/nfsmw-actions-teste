name: NFSMW - Kaggle PRE100 (smoke seguro)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/requests/*.json'

permissions:
  contents: read

concurrency:
  group: nfsmw-kaggle-smoke
  cancel-in-progress: false

jobs:
  submit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar segredo de forma silenciosa
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'KAGGLE_API_TOKEN nao configurado nos Secrets do repositorio.' >&2
            exit 1
          fi
      - name: Instalar CLI oficial Kaggle e dependência ausente
        run: |
          python -m pip install --disable-pip-version-check kaggle six
          python -c 'import six; from kaggle.cli import main; print("Kaggle CLI import OK")'
      - name: Criar notebook isolado de teste
        run: python automation/kaggle/create_smoke.py --output /tmp/nfsmw-smoke-kaggle
      - name: Publicar e executar notebook de teste no Kaggle
        run: kaggle kernels push -p /tmp/nfsmw-smoke-kaggle
      - name: Mostrar link do teste
        run: echo 'https://www.kaggle.com/code/juniklx/nfsmw-automacao-smoke-pre100'
