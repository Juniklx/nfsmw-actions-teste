name: NFSMW - Kaggle PRE100 (smoke seguro)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/requests/*.json'

permissions:
  contents: write

concurrency:
  group: nfsmw-kaggle-smoke
  cancel-in-progress: false

jobs:
  submit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar segredo de forma silenciosa
        id: auth
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'KAGGLE_API_TOKEN nao configurado nos Secrets do repositorio.' >&2
            exit 1
          fi
      - name: Instalar CLI oficial Kaggle e dependência ausente
        id: install
        run: |
          python -m pip install --disable-pip-version-check kaggle six
          python -c 'import six; from kaggle.cli import main; print("Kaggle CLI import OK")'
      - name: Criar notebook isolado de teste
        id: generate
        run: python automation/kaggle/create_smoke.py --output /tmp/nfsmw-smoke-kaggle --run-id "$GITHUB_RUN_ID"
      - name: Publicar e executar notebook de teste no Kaggle
        id: submit
        continue-on-error: true
        run: kaggle kernels push -p /tmp/nfsmw-smoke-kaggle
      - name: Aguardar execucao Kaggle e conferir arquivo de saida
        id: poll
        if: steps.submit.outcome == 'success'
        continue-on-error: true
        run: |
          python automation/kaggle/check_smoke_completion.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre101-poll.json \
            --output-dir /tmp/nfsmw-pre101-output \
            --timeout-seconds 900
      - name: Registrar resultado consultavel pelo ChatGPT
        if: always()
        env:
          AUTH_RESULT: ${{ steps.auth.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          GENERATE_RESULT: ${{ steps.generate.outcome }}
          SUBMIT_RESULT: ${{ steps.submit.outcome }}
          POLL_RESULT: ${{ steps.poll.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('automation/kaggle/status/latest.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          poll_path = Path('/tmp/nfsmw-pre101-poll.json')
          poll = json.loads(poll_path.read_text(encoding='utf-8')) if poll_path.is_file() else {}
          data = {
              'etapa': 'PRE100_KAGGLE_AUTOMACAO_SMOKE',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'auth_check': os.environ['AUTH_RESULT'],
              'kaggle_cli_install': os.environ['INSTALL_RESULT'],
              'notebook_generation': os.environ['GENERATE_RESULT'],
              'kaggle_push': os.environ['SUBMIT_RESULT'],
              'kaggle_status_poll': os.environ['POLL_RESULT'],
              'kaggle_final_status': poll.get('kaggle_final_status', 'NAO_CONFIRMADO'),
              'kaggle_execution_completed': bool(poll.get('kaggle_execution_completed', False)),
              'result_marker_confirmed': bool(poll.get('result_marker_confirmed', False)),
              'execution_verification': poll.get('resultado', 'NAO_VERIFICADO'),
              'execution_validation_error': poll.get('erro'),
              'notebook_original_modificado': False,
              'smoke_notebook': 'juniklx/nfsmw-automacao-smoke-pre100',
          }
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('Status PRE100 preparado; sem segredos ou tokens.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/latest.json
          git commit -m 'Record PRE100 Kaggle smoke execution status [skip ci]'
          git push
      - name: Falhar se envio ou execucao Kaggle nao foram comprovados
        if: always()
        env:
          SUBMIT_RESULT: ${{ steps.submit.outcome }}
          POLL_RESULT: ${{ steps.poll.outcome }}
        run: |
          test "$SUBMIT_RESULT" = 'success'
          test "$POLL_RESULT" = 'success'
