name: NFSMW PRE557 original PAL ZZDATA4 full SHA256 read-only parity reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre557_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre557-original-pal-zzdata4-readonly-sha
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SHA stream reader and pinned original PAL file source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre557_original_pal_zzdata4_sha256_readonly.py
      - name: Stream original PAL ZIP member in RAM for CRC32 and full SHA256
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre557_original_pal_zzdata4_sha256_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Guard no game assets released or edited; publish SHA only
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("/tmp/nfsmw-pre557/report.json")
          r=json.loads(src.read_text()) if src.exists() else {"stage":"PRE557","status":"FAILED_NO_REPORT"}
          for name in ("source_zip_or_game_assets_published","user_translation_file_bytes_checked",
                       "actual_v48_runtime_VFS_verified","guest_new_BMW_ExpN_accepted",
                       "APK_built","game_assets_modified","save_modified",
                       "signing_material_accessed","BMW_tuning_enabled"):
              if r.get(name,False) is not False:
                  raise SystemExit("PRE557 safety/claim boundary violation: "+name)
          if r.get("status")=="AUDIT_OK":
              if (r.get("source_authenticated_full_stream_CRC32_and_SHA256") is not True
                  or len(r.get("original_pal_uncompressed_member_sha256",""))!=64
                  or r.get("original_pal_uncompressed_member_bytes")!=401068032
                  or r.get("original_pal_uncompressed_member_zip_crc32_hex")!="b46a396c"):
                  raise SystemExit("PRE557 original file hash did not validate")
              path=Path("docs/PRE557_ORIGINAL_PAL_ZZDATA4_FULL_SHA256_READONLY.json")
          else:
              path=Path("docs/PRE557_ORIGINAL_PAL_ZZDATA4_FULL_SHA256_DIAGNOSTIC.json")
              r={k:r.get(k) for k in ("stage","status","error_type","error","run_id") if k in r}
              r["BMW_tuning_enabled"]=False
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(r,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE557_ORIGINAL_PAL_ZZDATA4_FULL_SHA256_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE557: original PAL extracted ZZDATA4 SHA256-only reference"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Store only numeric fingerprint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre557-pal-original-sha
          path: /tmp/nfsmw-pre557/report.json
          retention-days: 14
