name: NFSMW PRE408 V46 Nitro success canonical context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre408_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre408-v46-nitro-success-context
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify script and install Drive dependencies
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre408_sync_v46_nitro_success_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup and append verified V46 Nitro runtime evidence to context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre408_sync_v46_nitro_success_context.py
      - name: Preserve bounded sync audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre408-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre408/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
      - name: Publish sanitized context backup/readback result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE408 --report /tmp/nfsmw-pre408/CONTEXT_SYNC_STATUS.json
