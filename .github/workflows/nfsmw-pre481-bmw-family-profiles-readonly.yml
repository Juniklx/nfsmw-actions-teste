name: NFSMW PRE481 audit named BMW performance family profiles original PAL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre481_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre481-bmw-family
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated PAL VPAK reader and static script
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre474_bmw_punto_refs_readonly.py automation/kaggle/pre476_pal_performance_reference_resolution_readonly.py automation/kaggle/pre477_pal_bmw_punto_physics_layout_compare.py automation/kaggle/pre481_pal_bmw_family_profile_inventory_readonly.py
      - name: Read-only BMW family profile inventory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre481_pal_bmw_family_profile_inventory_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Persist sanitized profile identifiers, parent hashes, scalar metadata only
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("/tmp/nfsmw-pre481/report.json")
          data=json.loads(f.read_text()) if f.is_file() else {"status":"FAILED_NO_REPORT"}
          if data.get("runtime_mod_enabled",False) is not False or data.get("apk_built",False) is not False:
              raise SystemExit("Unexpected PRE481 mutation")
          if data.get("status")=="AUDIT_OK":
              dest=Path("docs/PRE481_PAL_BMW_FAMILY_PERFORMANCE_PROFILES_READONLY.json")
              if data.get("custom_upgrade_physics_proven") is not False:
                  raise SystemExit("PRE481 fail-closed")
          else:
              dest=Path("docs/PRE481_PAL_BMW_FAMILY_DIAGNOSTIC.json")
              data={key:data.get(key) for key in ("stage","status","error_type","error","run_id") if key in data}
              data["runtime_mod_enabled"]=False
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE481_PAL_BMW_FAMILY_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE481: persist original BMW family performance profile inventory"
          git push origin HEAD:main
      - name: Archive private metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre481-bmw-family-original-${{ github.run_id }}
          path: /tmp/nfsmw-pre481/report.json
          if-no-files-found: warn
          retention-days: 14
