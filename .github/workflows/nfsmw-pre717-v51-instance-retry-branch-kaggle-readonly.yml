name: NFSMW PRE717 - V51 bool-pointer flow Kaggle READONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre717_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre717-kaggle-readonly
  cancel-in-progress: false
jobs:
  kaggle-v51-presenter-audit:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local syntax and synthetic gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py automation/kaggle/pre704_generate_private_v51_kernel.py automation/kaggle/pre717_generate_private_v51_kernel.py
          python automation/kaggle/pre704_generate_private_v51_kernel.py --self-test
          python automation/kaggle/pre717_generate_private_v51_kernel.py --self-test
      - name: Prepare only Google API and Kaggle CLI libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests zstandard kaggle six >/dev/null
      - name: Authenticate V51 source recipe without APK build
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          test -n "$GOOGLE_REFRESH_TOKEN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          python automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre704-auth-source')
          m=json.loads((p/'manifest.json').read_text())
          assert m['stage']=='PRE704_AUTHENTICATED_V51_UI_SOURCE_BUNDLE'
          assert m['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
          assert m['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
          assert m['pre99_sha256']=='af8e82e198d00656814477fd64b8cc791fada21d937c1aa1cc583e5d37768b39'
          with zipfile.ZipFile(p/'pre704_v51_ui_sources.zip') as z:
              assert z.testzip() is None and len(z.namelist())==m['count']
          print('PRE704_SOURCE_BUNDLE_AUTHENTICATED=TRUE')
          print('PRE704_SOURCE_BUNDLE_FILES='+str(m['count']))
          PY
      - name: Prepare private isolated Kaggle V51 notebook
        run: |
          set -euo pipefail
          python automation/kaggle/pre717_generate_private_v51_kernel.py --manifest /tmp/nfsmw-pre704-auth-source/manifest.json --archive /tmp/nfsmw-pre704-auth-source/pre704_v51_ui_sources.zip --output /tmp/nfsmw-pre717-kernel --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre717-kernel')
          meta=json.loads((p/'kernel-metadata.json').read_text())
          note=json.loads((p/'pre717.ipynb').read_text())
          assert meta['id']=='juniklx/nfsmw-pre717-v51-instance-retry-branch-readonly'
          import re
          slug=re.sub(r'[^a-z0-9]+','-',meta['title'].lower()).strip('-')
          assert meta['id']=='juniklx/'+slug
          assert meta['is_private'] and not meta['enable_gpu'] and not meta['enable_internet']
          assert len(note['cells'])==2
          source=''.join(note['cells'][1]['source'])
          compile(source, '<PRE717 Kaggle notebook>', 'exec')
          for secret in ('GOOGLE_REFRESH_TOKEN','GOOGLE_CLIENT_SECRET','KAGGLE_API_TOKEN','NFSMW_ASSINATURA_PERMANENTE'):
              assert secret not in source
          print('PRE717_KAGGLE_PRIVATE_NOTEBOOK_PREFLIGHT=PASS')
          PY
      - name: Start Kaggle isolated notebook, never original juniklx/nfsmw
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels push -p /tmp/nfsmw-pre717-kernel
      - name: Poll Kaggle and validate conservative PRE717 source report
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          kernel='juniklx/nfsmw-pre717-v51-instance-retry-branch-readonly'
          out=Path('/tmp/nfsmw-pre717-result')
          out.mkdir(parents=True,exist_ok=True)
          deadline=time.monotonic()+3400
          prev=''
          errors=0
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',kernel],capture_output=True,text=True,timeout=90)
              if p.returncode:
                  errors+=1
                  if errors>=10: raise RuntimeError('PRE717_KAGGLE_STATUS_UNREADABLE')
                  time.sleep(15)
                  continue
              errors=0
              match=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+' '+p.stderr)
              state=match.group(1) if match else 'UNKNOWN'
              if state!=prev:
                  print('PRE717_REMOTE_STATE='+state,flush=True)
                  prev=state
              if state in ('ERROR','FAILED','CANCELLED','CANCELED'):
                  raise RuntimeError('PRE717_KAGGLE_FAILED')
              if state=='COMPLETE':
                  download=subprocess.run(['kaggle','kernels','output',kernel,'-p',str(out),'-o'],
                            capture_output=True,text=True,timeout=180)
                  if download.returncode==0:
                      for fp in out.rglob('NFSMW_PRE717_KAGGLE_REMOTE.json'):
                          d=json.loads(fp.read_text(encoding='utf-8'))
                          if d.get('github_run_id')!=os.environ['GITHUB_RUN_ID'] or d.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']:
                              continue
                          assert d['stage']=='PRE717_V51_KAGGLE_INSTANCE_RETRY_BRANCH_READONLY'
                          assert d['status']=='PASS_PRE717_V51_SOURCE_RETRY_CANDIDATE_AUDITED'
                          assert d['analysis_type']=='PRE717_AUTHENTICATED_V51_INSTANCE_RETRY_CONSERVATIVE_LEXICAL_ONLY'
                          assert d['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
                          assert d['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
                          assert d['source_or_apk_modified'] is False
                          assert d['signing_material_accessed'] is False
                          assert d['fps_gain_proven'] is False
                          assert d['runtime_vk_device_enabled_extensions']=='NOT_VERIFIED'
                          assert d['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          prev716=d['pre716_boolptr_lifetime_map']
                          assert prev716['authenticated_source_sha_checks'] is True
                          assert prev716['source_findings']['instance_create_info']['create_lines']==[523,537]
                          data=d['pre717_instance_retry_audit']
                          assert data['stage']=='PRE717_AUTHENTICATED_V51_VKCREATEINSTANCE_RETRY_BRANCH_SOURCE_AUDIT'
                          assert data['source_sha_checks_inherited_from_PRE704'] is True
                          assert data['actual_recovery_semantics_proven'] is False
                          assert data['runtime_retry_observed'] is False
                          assert data['no_source_or_apk_changes'] is True
                          facts=data['source_findings']
                          assert [z['line'] for z in facts['create_calls']]==[523,537]
                          assert all(z['extracted'] for z in facts['create_calls'])
                          assert facts['loop_line528_to_write529']['for_header_extracted'] is True
                          assert facts['loop_line528_to_write529']['direct_pointer_write_line529'] is True
                          assert facts['second_call_after_pointer_write'] is True
                          assert facts['conditions_proven_cpp_cfg'] is False
                          assert facts['vk_create_instance_retry_executed_at_runtime']=='NOT_VERIFIED'
                          assert facts['source_to_installed_signed_elf_equivalence']=='UNVERIFIED'
                          assert facts['source_text_exported'] is False
                          assert facts['signing_material_accessed'] is False
                          assert facts['apk_built'] is False
                          assert facts['apk_modified'] is False
                          assert facts['fps_gain_proven'] is False
                          assert facts['runtime_instance_extensions']=='NOT_VERIFIED'
                          assert isinstance(facts['candidate_guards'],list)
                          (out/'PRE717_V51_KAGGLE_VALIDATED_SUMMARY.json').write_text(
                              json.dumps(d,indent=2,sort_keys=True)+'\n')
                          print('PRE717_KAGGLE_REMOTE_VALIDATED=TRUE')
                          print('PRE717_VKCREATEINSTANCE_CALLS='+str(len(facts['create_calls'])))
                          print('PRE717_FLAG_WRITE_LINK='+str(facts['loop_line528_to_write529'].get('loop_variable_match_to_deref529')))
                          print('PRE717_RUNTIME_RECOVERY_PROVEN=FALSE')
                          raise SystemExit(0)
              time.sleep(15)
          raise TimeoutError('PRE717_REMOTE_RESULT_NOT_VERIFIED')
          PY
      - name: Archive sanitized reports, never source or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre717-kaggle-readonly-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre717-result/PRE717_V51_KAGGLE_VALIDATED_SUMMARY.json
            /tmp/nfsmw-pre717-result/NFSMW_PRE717_KAGGLE_REMOTE.json
          if-no-files-found: warn
          retention-days: 30
