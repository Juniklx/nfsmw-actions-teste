name: NFSMW PRE718 - V51 instance pointer fallback Kaggle READONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre718_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre718-kaggle-readonly
  cancel-in-progress: false
jobs:
  kaggle-v51-presenter-audit:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local syntax and synthetic gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py automation/kaggle/pre704_generate_private_v51_kernel.py automation/kaggle/pre718_generate_private_v51_kernel.py
          python automation/kaggle/pre704_generate_private_v51_kernel.py --self-test
          python automation/kaggle/pre718_generate_private_v51_kernel.py --self-test
      - name: Prepare only Google API and Kaggle CLI libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests zstandard kaggle six >/dev/null
      - name: Authenticate V51 source recipe without APK build
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          test -n "$GOOGLE_REFRESH_TOKEN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          python automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre704-auth-source')
          m=json.loads((p/'manifest.json').read_text())
          assert m['stage']=='PRE704_AUTHENTICATED_V51_UI_SOURCE_BUNDLE'
          assert m['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
          assert m['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
          assert m['pre99_sha256']=='af8e82e198d00656814477fd64b8cc791fada21d937c1aa1cc583e5d37768b39'
          with zipfile.ZipFile(p/'pre704_v51_ui_sources.zip') as z:
              assert z.testzip() is None and len(z.namelist())==m['count']
          print('PRE704_SOURCE_BUNDLE_AUTHENTICATED=TRUE')
          print('PRE704_SOURCE_BUNDLE_FILES='+str(m['count']))
          PY
      - name: Prepare private isolated Kaggle V51 notebook
        run: |
          set -euo pipefail
          python automation/kaggle/pre718_generate_private_v51_kernel.py --manifest /tmp/nfsmw-pre704-auth-source/manifest.json --archive /tmp/nfsmw-pre704-auth-source/pre704_v51_ui_sources.zip --output /tmp/nfsmw-pre718-kernel --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre718-kernel')
          meta=json.loads((p/'kernel-metadata.json').read_text())
          note=json.loads((p/'pre718.ipynb').read_text())
          assert meta['id']=='juniklx/nfsmw-pre718-v51-pointer-fallback-readonly'
          import re
          slug=re.sub(r'[^a-z0-9]+','-',meta['title'].lower()).strip('-')
          assert meta['id']=='juniklx/'+slug
          assert meta['is_private'] and not meta['enable_gpu'] and not meta['enable_internet']
          assert len(note['cells'])==2
          source=''.join(note['cells'][1]['source'])
          compile(source, '<PRE718 Kaggle notebook>', 'exec')
          for secret in ('GOOGLE_REFRESH_TOKEN','GOOGLE_CLIENT_SECRET','KAGGLE_API_TOKEN','NFSMW_ASSINATURA_PERMANENTE'):
              assert secret not in source
          print('PRE718_KAGGLE_PRIVATE_NOTEBOOK_PREFLIGHT=PASS')
          PY
      - name: Start Kaggle isolated notebook, never original juniklx/nfsmw
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels push -p /tmp/nfsmw-pre718-kernel
      - name: Poll Kaggle and validate conservative PRE718 pointer audit
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          kernel='juniklx/nfsmw-pre718-v51-pointer-fallback-readonly'
          out=Path('/tmp/nfsmw-pre718-result')
          out.mkdir(parents=True,exist_ok=True)
          deadline=time.monotonic()+3400
          prev=''
          errors=0
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',kernel],capture_output=True,text=True,timeout=90)
              if p.returncode:
                  errors+=1
                  if errors>=10: raise RuntimeError('PRE718_KAGGLE_STATUS_UNREADABLE')
                  time.sleep(15)
                  continue
              errors=0
              match=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+' '+p.stderr)
              state=match.group(1) if match else 'UNKNOWN'
              if state!=prev:
                  print('PRE718_REMOTE_STATE='+state,flush=True)
                  prev=state
              if state in ('ERROR','FAILED','CANCELLED','CANCELED'):
                  raise RuntimeError('PRE718_KAGGLE_FAILED')
              if state=='COMPLETE':
                  download=subprocess.run(['kaggle','kernels','output',kernel,'-p',str(out),'-o'],
                            capture_output=True,text=True,timeout=180)
                  if download.returncode==0:
                      for fp in out.rglob('NFSMW_PRE718_KAGGLE_REMOTE.json'):
                          d=json.loads(fp.read_text(encoding='utf-8'))
                          if d.get('github_run_id')!=os.environ['GITHUB_RUN_ID'] or d.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']:
                              continue
                          assert d['stage']=='PRE718_V51_KAGGLE_INSTANCE_POINTER_FALLBACK_READONLY'
                          assert d['status']=='PASS_PRE718_V51_CONSERVATIVE_RETRY_POINTER_AUDIT'
                          assert d['analysis_type']=='PRE718_AUTHENTICATED_V51_INSTANCE_RETRY_DATAFLOW_LEXICAL_ONLY'
                          assert d['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
                          assert d['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
                          assert d['source_or_apk_modified'] is False
                          assert d['signing_material_accessed'] is False
                          assert d['fps_gain_proven'] is False
                          assert d['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          assert d['pre717_instance_retry_audit']['source_findings']['first_second_call_arguments_lexically_equal'] is True
                          audit=d['pre718_instance_retry_dataflow_audit']
                          assert audit['stage']=='PRE718_AUTHENTICATED_V51_INSTANCE_RETRY_VECTOR_POINTER_DATAFLOW'
                          assert audit['source_sha_checks_inherited_and_crosschecked'] is True
                          assert audit['stale_pointer_bug_proven'] is False
                          assert audit['runtime_recovery_proven'] is False
                          assert audit['source_or_apk_modified'] is False
                          f=audit['source_findings']
                          assert f['line_501_pointer_setup']['assignment_detected'] is True
                          assert f['line_500_extension_count_setup']['assignment_detected'] is True
                          assert f['line_535_extension_count_reset']['assignment_detected'] is True
                          assert f['line_525_error_guard']['condition_extracted'] is True
                          assert f['line_525_error_guard']['contains_both_extension_layer_errors'] is True
                          assert f['line_528_bool_pointer_loop']['header_extracted'] is True
                          assert f['line_531_rebuild_loop']['header_extracted'] is True
                          assert isinstance(f['lexical_operations'],list)
                          assert f['raw_source_exported'] is False
                          assert f['private_identifier_spelling_exported'] is False
                          assert f['full_cpp_ast_or_cfg_proven'] is False
                          assert f['actual_pointer_lifetime_proven'] is False
                          assert f['runtime_instance_extensions']=='NOT_VERIFIED'
                          assert f['source_to_signed_apk_elf_equivalence']=='UNVERIFIED'
                          assert f['apk_built'] is False
                          assert f['apk_modified'] is False
                          assert f['secrets_accessed'] is False
                          assert f['fps_gain_proven'] is False
                          (out/'PRE718_V51_KAGGLE_VALIDATED_SUMMARY.json').write_text(
                              json.dumps(d,indent=2,sort_keys=True)+'\n')
                          print('PRE718_KAGGLE_REMOTE_VALIDATED=TRUE')
                          print('PRE718_EXTENSION_COUNT_WRITE_LINES='+str(
                              f['pointer_and_extension_count_correspondence']['count_update_lines']))
                          print('PRE718_POINTER_WRITE_LINES='+str(
                              f['pointer_and_extension_count_correspondence']['pointer_update_lines']))
                          print('PRE718_STALE_POINTER_BUG_PROVEN=FALSE')
                          raise SystemExit(0)
              time.sleep(15)
          raise TimeoutError('PRE718_REMOTE_RESULT_NOT_VERIFIED')
          PY
      - name: Archive sanitized reports, never source or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre718-kaggle-readonly-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre718-result/PRE718_V51_KAGGLE_VALIDATED_SUMMARY.json
            /tmp/nfsmw-pre718-result/NFSMW_PRE718_KAGGLE_REMOTE.json
          if-no-files-found: warn
          retention-days: 30
