name: NFSMW - PRE138 build and verify signed V31 PAL USA from PRE99 and PRE117+PRE128+PRE131+PRE133+LOG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/build_pre138_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre138-v31-logging-diagnostic-isolated
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies and validate scripts
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile \
            automation/kaggle/pre104_verify_backup_tar.py \
            automation/kaggle/pre105_read_settings_source.py \
            automation/kaggle/pre107_restore_isolated.py \
            automation/kaggle/pre117_one_scroll_android_dryrun.py \
            automation/kaggle/pre118_audit_build_tree.py \
            automation/kaggle/pre125_ephemeral_gradle_signing_preflight.py \
            automation/kaggle/pre127_apk_v2_certificate_audit.py \
            automation/kaggle/pre128_android_touch_scroll_visual_patch.py \
            automation/kaggle/pre131_native_touch_and_modern_ui_patch.py \
            automation/kaggle/pre133_mouse_bridge_swipe_patch.py \
            automation/kaggle/pre138_build_signed_v31_log_pal_usa.py \
            automation/kaggle/pre139_verify_dependency_cache.py
          python automation/kaggle/pre139_verify_dependency_cache.py --self-test
      - name: Prepare exact Android NDK CMake and SDK build tools in ephemeral runner
        id: android_tools
        continue-on-error: true
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "PRE138 preparing Android SDK tools; no game source or key accessed in this step"
          SDKMANAGER=""
          for p in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          test -n "$SDKMANAGER"
          # PRE139: check pinned versions and install ONLY genuinely missing tools.
          # Do not delete other NDKs. Each hosted runner is ephemeral anyway.
          MISSING=()
          [ -f "$SDK/ndk/28.2.13676358/source.properties" ] || MISSING+=("ndk;28.2.13676358")
          [ -d "$SDK/cmake/3.31.6" ] || MISSING+=("cmake;3.31.6")
          [ -f "$SDK/platforms/android-36/android.jar" ] || MISSING+=("platforms;android-36")
          [ -f "$SDK/build-tools/36.0.0/apksigner" ] || MISSING+=("build-tools;36.0.0")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "PRE139 SDK packages missing: ${#MISSING[@]}"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK" --install "${MISSING[@]}" \
              > /tmp/nfsmw-pre138-sdk-install.log 2>&1
            EXIT="${PIPESTATUS[1]}"
            set -o pipefail
            if [ "$EXIT" -ne 0 ]; then echo "PRE139 SDK install failed, exit=$EXIT"; exit "$EXIT"; fi
          else
            echo "PRE139 all pinned SDK tools already present; skipping SDK installer"
          fi
          test -f "$SDK/ndk/28.2.13676358/source.properties"
          test -d "$SDK/cmake/3.31.6"
          test -f "$SDK/build-tools/36.0.0/apksigner"
          test -f "$SDK/build-tools/36.0.0/aapt"
          echo "PRE138 ephemeral NDK/CMake/build-tools ready"
          df -h "$SDK" | tail -n 1
      - name: PRE139 restore dependency-only Gradle cache
        uses: actions/cache/restore@v4
        id: gradle_deps_cache
        with:
          path: |
            ${{ runner.temp }}/nfsmw-gradle-home/caches/modules-2
            ${{ runner.temp }}/nfsmw-gradle-home/wrapper
          key: nfsmw-pre99-gradle-ef570ba95703-jdk21-v1-${{ runner.os }}
      - name: PRE140 verify restored Gradle cache before build
        if: steps.gradle_deps_cache.outputs.cache-hit == 'true'
        run: |
          python automation/kaggle/pre139_verify_dependency_cache.py \
            --cache-home "${{ runner.temp }}/nfsmw-gradle-home"
      - name: PRE140 report cache restore status
        env:
          GRADLE_CACHE_HIT: ${{ steps.gradle_deps_cache.outputs.cache-hit }}
        run: |
          echo "Gradle dependency cache hit: ${GRADLE_CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Only modules-2 and wrapper; no game assets, signing data, native outputs." >> "$GITHUB_STEP_SUMMARY"
      - name: Build V31 release and strictly verify signed APK, preserve locally for private artifact
        id: release
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NFSMW_GRADLE_USER_HOME: ${{ runner.temp }}/nfsmw-gradle-home
        run: |
          set -e
          test "${{ steps.android_tools.outcome }}" = "success"
          mkdir -p /tmp/nfsmw-pre138-out
          python automation/kaggle/pre138_build_signed_v31_log_pal_usa.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre138-out/pre138-report.json \
            --verified-output /tmp/nfsmw-pre138-out/nfsmw-v31-pal-usa-verified.apk
      - name: PRE139 verify dependency-only cache contents before GitHub cache save
        id: deps_policy
        if: steps.release.outcome == 'success'
        run: |
          python automation/kaggle/pre139_verify_dependency_cache.py \
            --cache-home "${{ runner.temp }}/nfsmw-gradle-home" \
            --report /tmp/nfsmw-pre138-out/pre139-safe-cache-report.json
      - name: PRE140 persist audited Gradle dependency cache only after successful gate
        if: ${{ success() && steps.release.outcome == 'success' && steps.deps_policy.outcome == 'success' && steps.gradle_deps_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/nfsmw-gradle-home/caches/modules-2
            ${{ runner.temp }}/nfsmw-gradle-home/wrapper
          key: ${{ steps.gradle_deps_cache.outputs.cache-primary-key }}
      - name: Preserve private report and verified APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre138-v31-PRE117-PRE128-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre138-out/pre138-report.json
            /tmp/nfsmw-pre138-out/nfsmw-v31-pal-usa-verified.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Record only sanitized signed APK outcome in private GitHub
        if: always()
        env:
          PRE138_TOOLS: ${{ steps.android_tools.outcome }}
          PRE138_BUILD: ${{ steps.release.outcome }}
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import json,os
          src=Path('/tmp/nfsmw-pre138-out/pre138-report.json')
          data=json.loads(src.read_text(encoding='utf-8')) if src.is_file() else {'status':'SEM_RELATORIO'}
          data['tools_outcome']=os.environ['PRE138_TOOLS']
          data['build_outcome']=os.environ['PRE138_BUILD']
          data['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          dst=Path('automation/kaggle/status/pre138_v31_signed_release.json')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PRE138 sanitized outcome:',data['status'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre138_v31_signed_release.json
          git commit -m 'Record PRE138 V31 gated private release outcome [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Require fully validated and permanently signed V31 private artifact
        if: always()
        env:
          PRE138_BUILD: ${{ steps.release.outcome }}
        run: test "$PRE138_BUILD" = success
