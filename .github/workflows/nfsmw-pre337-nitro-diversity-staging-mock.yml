name: NFSMW PRE337 passive Nitro diversity staging regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre337_nitro_diversity_staging.py'
      - 'automation/kaggle/pre337_nitro_diversity_staging_mock.py'
permissions:
  contents: write
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test PRE317 to PRE337 byte-reversible passive callback
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre337_nitro_diversity_staging.py automation/kaggle/pre337_nitro_diversity_staging_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre337_nitro_diversity_staging_mock.py
          mkdir -p /tmp/nfsmw-pre337
          printf '%s\n' '{"status":"AUDIT_OK","owner_verified":false}' > /tmp/nfsmw-pre337/status.json
      - name: Publish sanitized PRE337 status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE337 --report /tmp/nfsmw-pre337/status.json
