name: NFSMW PRE243 maintained hooks logging CVAR audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre243_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre243-readonly
  cancel-in-progress: false
jobs:
  integration-api-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated read-only Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check
        run: python -m py_compile automation/kaggle/pre243_hook_logging_cvar_readonly.py
      - name: Inspect maintained hook and logging interfaces from authenticated snapshot
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre243_hook_logging_cvar_readonly.py
      - name: Preserve private JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre243-integration-api-${{ github.run_id }}
          path: /tmp/nfsmw-pre243/NFSMW_PRE243_HOOK_LOGGING_CVAR_INTEGRATION_AUDIT.json
          if-no-files-found: warn
          retention-days: 14
