name: NFSMW PRE328 audit status privacy regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre328_publish_sanitized_audit_status.py'
      - 'automation/kaggle/pre328_publish_sanitized_audit_status_mock.py'
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PRE328 allowlisted output privacy contract
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre328_publish_sanitized_audit_status.py automation/kaggle/pre328_publish_sanitized_audit_status_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre328_publish_sanitized_audit_status_mock.py
