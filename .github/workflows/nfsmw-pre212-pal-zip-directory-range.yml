name: NFSMW PRE212 PAL ZIP central directory range audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre212_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre212-pal-zip-readonly
  cancel-in-progress: false
jobs:
  range-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Drive reader dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve pinned PRE212 script, never transfer complete ISO or ZIP
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],
            client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          service=build("drive","v3",credentials=c,cache_discovery=False)
          buf=io.BytesIO()
          dl=MediaIoBaseDownload(buf,service.files().get_media(fileId="1aCH8blJIr6B0ih2rsfYS8VbFesUSQ1Pn"))
          done=False
          while not done:
            _,done=dl.next_chunk()
          data=buf.getvalue()
          actual=hashlib.sha256(data).hexdigest()
          expected="d3efcd6258ecee92449e48238e79c10eed1cabe6844eabdaa3da0718a1a0539c"
          if actual!=expected:raise ValueError("PRE212 pinned script SHA mismatch")
          Path("/tmp/nfsmw_pre212_drive_zip_central_directory_readonly.py").write_bytes(data)
          print("PRE212_SCRIPT_SHA_OK",actual)
          PY
          python -m py_compile /tmp/nfsmw_pre212_drive_zip_central_directory_readonly.py
      - name: Probe PAL ZIP via bounded HTTP 206 byte ranges
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python /tmp/nfsmw_pre212_drive_zip_central_directory_readonly.py
      - name: Upload JSON report only (no game data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre212-pal-directory-${{ github.run_id }}
          path: /tmp/nfsmw-pre212/NFSMW_PRE212_PAL_ZIP_RANGE_DIRECTORY.json
          if-no-files-found: warn
          retention-days: 14
