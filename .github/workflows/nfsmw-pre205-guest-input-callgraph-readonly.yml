name: NFSMW PRE205 - game input reverse callgraph read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre205_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre205-game-input-callgraph
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Drive reader and compile audit script syntax
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre205_guest_input_callgraph_readonly.py
      - name: Verify PRE99 and follow input wrapper direct call sites
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          python automation/kaggle/pre205_guest_input_callgraph_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save immutable audit output as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre205-input-callgraph-${{ github.run_id }}
          path: /tmp/nfsmw-pre205/PRE205_REVERSE_INPUT_CALLGRAPH.json
          retention-days: 14
          if-no-files-found: warn
