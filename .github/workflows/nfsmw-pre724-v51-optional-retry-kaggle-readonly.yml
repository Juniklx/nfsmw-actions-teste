name: NFSMW PRE724 - V51 optional extension retry Kaggle READONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre724_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre724-kaggle-readonly
  cancel-in-progress: false
jobs:
  kaggle-v51-presenter-audit:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local syntax and synthetic gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py automation/kaggle/pre704_generate_private_v51_kernel.py automation/kaggle/pre724_generate_private_v51_kernel.py
          python automation/kaggle/pre704_generate_private_v51_kernel.py --self-test
          python automation/kaggle/pre724_generate_private_v51_kernel.py --self-test
      - name: Prepare only Google API and Kaggle CLI libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests zstandard kaggle six >/dev/null
      - name: Authenticate V51 source recipe without APK build
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          test -n "$GOOGLE_REFRESH_TOKEN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          python automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre704-auth-source')
          m=json.loads((p/'manifest.json').read_text())
          assert m['stage']=='PRE704_AUTHENTICATED_V51_UI_SOURCE_BUNDLE'
          assert m['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
          assert m['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
          assert m['pre99_sha256']=='af8e82e198d00656814477fd64b8cc791fada21d937c1aa1cc583e5d37768b39'
          with zipfile.ZipFile(p/'pre704_v51_ui_sources.zip') as z:
              assert z.testzip() is None and len(z.namelist())==m['count']
          print('PRE704_SOURCE_BUNDLE_AUTHENTICATED=TRUE')
          print('PRE704_SOURCE_BUNDLE_FILES='+str(m['count']))
          PY
      - name: Prepare private isolated Kaggle V51 notebook
        run: |
          set -euo pipefail
          python automation/kaggle/pre724_generate_private_v51_kernel.py --manifest /tmp/nfsmw-pre704-auth-source/manifest.json --archive /tmp/nfsmw-pre704-auth-source/pre704_v51_ui_sources.zip --output /tmp/nfsmw-pre724-kernel --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre724-kernel')
          meta=json.loads((p/'kernel-metadata.json').read_text())
          note=json.loads((p/'pre724.ipynb').read_text())
          assert meta['id']=='juniklx/nfsmw-pre724-v51-optional-retry'
          import re
          slug=re.sub(r'[^a-z0-9]+','-',meta['title'].lower()).strip('-')
          assert meta['id']=='juniklx/'+slug
          assert meta['is_private'] and not meta['enable_gpu'] and not meta['enable_internet']
          assert len(note['cells'])==2
          source=''.join(note['cells'][1]['source'])
          compile(source, '<PRE724 Kaggle notebook>', 'exec')
          for secret in ('GOOGLE_REFRESH_TOKEN','GOOGLE_CLIENT_SECRET','KAGGLE_API_TOKEN','NFSMW_ASSINATURA_PERMANENTE'):
              assert secret not in source
          print('PRE724_KAGGLE_PRIVATE_NOTEBOOK_PREFLIGHT=PASS')
          PY
      - name: Start Kaggle isolated notebook, never original juniklx/nfsmw
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels push -p /tmp/nfsmw-pre724-kernel
      - name: Poll Kaggle and verify PRE724 optional extension retry guard
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path
          kernel='juniklx/nfsmw-pre724-v51-optional-retry'
          out=Path('/tmp/nfsmw-pre724-result')
          out.mkdir(parents=True,exist_ok=True)
          deadline=time.monotonic()+3400
          last=''
          fails=0
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',kernel],
                  capture_output=True,text=True,timeout=90)
              if p.returncode:
                  fails+=1
                  if fails>=10:raise RuntimeError('PRE724_KAGGLE_STATUS_UNREADABLE')
                  time.sleep(15)
                  continue
              fails=0
              m=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+' '+p.stderr)
              state=m.group(1) if m else 'UNKNOWN'
              if state!=last:
                  print('PRE724_REMOTE_STATE='+state,flush=True)
                  last=state
              if state in ('ERROR','FAILED','CANCELLED','CANCELED'):
                  raise RuntimeError('PRE724_REMOTE_KERNEL_ERROR')
              if state=='COMPLETE':
                  got=subprocess.run(['kaggle','kernels','output',kernel,'-p',str(out),'-o'],
                         capture_output=True,text=True,timeout=180)
                  if got.returncode==0:
                      for fp in out.rglob('NFSMW_PRE724_KAGGLE_REMOTE.json'):
                          d=json.loads(fp.read_text(encoding='utf-8'))
                          if d.get('github_run_id')!=os.environ['GITHUB_RUN_ID'] or d.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']:
                              continue
                          assert d['stage']=='PRE724_V51_KAGGLE_OPTIONAL_RETRY_READONLY'
                          assert d['status']=='PASS_PRE724_V51_OPTIONAL_RETRY_LEXICAL_AUDIT',d.get('status')
                          assert d['analysis_type']=='PRE724_AUTHENTICATED_V51_OPTIONAL_RETRY_GUARD_LEXICAL'
                          assert d['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
                          assert d['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
                          assert d['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          assert d['source_or_apk_modified'] is False
                          assert d['signing_material_accessed'] is False
                          assert d['fps_gain_proven'] is False
                          audit=d['pre724_optional_extension_retry_branch_audit']
                          assert audit['stage']=='PRE724_V51_OPTIONAL_EXTENSION_RETRY_GUARD_READONLY'
                          assert audit['authenticated_v51_source_inherited'] is True
                          assert audit['real_cpp_ast_or_cfg_used'] is False
                          assert audit['synthetic_model_not_actual_source'] is True
                          assert audit['runtime_vulkan_tested'] is False
                          assert audit['stale_pointer_bug_proven'] is False
                          assert audit['extension_count_mismatch_proven'] is False
                          assert audit['apk_modified'] is False
                          assert audit['apk_built'] is False
                          assert audit['signing_material_accessed'] is False
                          assert audit['fps_gain_proven'] is False
                          assert audit['source_text_exported'] is False
                          f=audit['source_findings']
                          assert f['complete'] is True
                          assert f['line454_455_scope']['target_in_lexical_braces'] is True
                          assert f['line537_second_vk_create_inside_retry_guard_lexically'] is True
                          assert f['line535_count_reset_inside_guard_lexically'] is True
                          assert f['line523_vk_create_shape'] is True and f['line537_vk_create_shape'] is True
                          assert f['vk_create_call_args_identical_sha256'] is True
                          assert f['count_field_assignment_between_523_537']==[535]
                          assert f['pointer_field_assignment_between_523_537']==[]
                          assert f['synthetic_prefix_model']['initial_pointer_prefix_equals_originals'] is True
                          assert f['synthetic_model_is_actual_cpp_or_vulkan_test'] is False
                          assert f['guard_really_taken_in_runtime']=='NOT_VERIFIED'
                          assert f['cpp_ast_cfg_semantics']=='NOT_VERIFIED'
                          assert f['source_text_exported'] is False
                          assert f['private_identifiers_exported'] is False
                          (out/'PRE724_V51_KAGGLE_VALIDATED_SUMMARY.json').write_text(
                             json.dumps(d,indent=2,sort_keys=True)+'\n')
                          print('PRE724_KAGGLE_REMOTE_VALIDATED=TRUE',flush=True)
                          print('PRE724_OPTIONAL_INSERTION_LEXICAL_BRANCH=TRUE',flush=True)
                          print('PRE724_RETRY_LEXICAL_GUARD=TRUE',flush=True)
                          print('PRE724_ACTUAL_VULKAN_RETRY_NOT_VERIFIED=TRUE',flush=True)
                          raise SystemExit(0)
              time.sleep(15)
          raise TimeoutError('PRE724_REMOTE_RESULT_NOT_VERIFIED')
          PY
      - name: Archive sanitized reports, never source or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre724-kaggle-readonly-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre724-result/PRE724_V51_KAGGLE_VALIDATED_SUMMARY.json
            /tmp/nfsmw-pre724-result/NFSMW_PRE724_KAGGLE_REMOTE.json
          if-no-files-found: warn
          retention-days: 30
