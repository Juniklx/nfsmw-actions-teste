name: NFSMW PRE266 BMW V38 source integration preflight (no build)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre266_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre266-bmw-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only PRE99 client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check only
        run: python -m py_compile automation/kaggle/pre266_bmw_menu_v38_disposable_preflight.py
      - name: Verify V37 generated instrumentation and disabled BMW menu guard
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre266_bmw_menu_v38_disposable_preflight.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre266-bmw-v38-preflight-${{ github.run_id }}
          path: /tmp/nfsmw-pre266/PRE266_BMW_MENU_V38_DISPOSABLE_PREFLIGHT.json
          retention-days: 14
          if-no-files-found: warn
