name: NFSMW PRE223B TeamXPG patch table and menu labels validation read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre223b_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre223b-teamxpg-patch-restore-readonly
  cancel-in-progress: false
jobs:
  trainer-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded read-only analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools >/dev/null
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests capstone cryptography >/dev/null
      - name: Retrieve four SHA-pinned PRE208 PRE222 PRE223 PRE223B scripts
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
             token_uri="https://oauth2.googleapis.com/token",
             client_id=os.environ["GOOGLE_CLIENT_ID"],
             client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          svc=build("drive","v3",credentials=c,cache_discovery=False)
          pinned=[
            ("15FQFLM018-mHsoYxuuvMn7mZp35ojvmS","nfsmw_pre208_teamxpg_decoder_audit.py","000a6db5cffb6a046a99af4da71c8911a846a5da3d3d7dfaa7fecf7ca37f98e9"),
            ("1Tdgh-y5gCpa07aG8vGw8GZ4k0jmG-j7I","nfsmw_pre222_teamxpg_payload_toggle_readonly.py","da24dcfba6cb9c5d5ac6560726fe6c6b3080d531264bd3b4e3f6ad77fb4e90c8"),
            ("13lKL3tfq64VN86CXawlt7zg7njITEYUX","nfsmw_pre223_teamxpg_buffer_menu_readonly.py","8c2456a9bfad4d15fa2b6ef1e388746a8b74c6c6675093ebf4f35bfb0f5156e8"),
            ("1Y0hL_lBVM6peNiB_bHzunCh9VVVLZgVG","nfsmw_pre223b_teamxpg_nop_restoration_readonly.py","b1fb6a8d6e6f74b559624e9f9139418d13f26ad0123786e597a3dd563828e5ea"),
          ]
          for fid,name,sha in pinned:
            buf=io.BytesIO(); dl=MediaIoBaseDownload(buf,svc.files().get_media(fileId=fid))
            done=False
            while not done: _,done=dl.next_chunk()
            if hashlib.sha256(buf.getvalue()).hexdigest()!=sha:raise ValueError("Pinned SHA differs: "+name)
            Path("/tmp",name).write_bytes(buf.getvalue())
            print("PRE223B_SCRIPT_SHA_OK",name)
          PY
          python -m py_compile /tmp/nfsmw_pre208_teamxpg_decoder_audit.py /tmp/nfsmw_pre222_teamxpg_payload_toggle_readonly.py /tmp/nfsmw_pre223_teamxpg_buffer_menu_readonly.py /tmp/nfsmw_pre223b_teamxpg_nop_restoration_readonly.py
      - name: Check trainer common patch word, static restore words and UI pointer provenance
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp:automation/kaggle python /tmp/nfsmw_pre223b_teamxpg_nop_restoration_readonly.py
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre223b-teamxpg-patchrestore-${{ github.run_id }}
          path: /tmp/nfsmw-pre223b/NFSMW_PRE223B_TRAINER_PATCH_VS_RESTORE.json
          if-no-files-found: warn
          retention-days: 14
