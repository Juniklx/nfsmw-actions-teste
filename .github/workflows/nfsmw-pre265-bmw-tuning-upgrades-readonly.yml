name: NFSMW PRE265 BMW performance and Junkman PAL audit (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre265_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre265-bmw-upgrades
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Validate read-only source audit script syntax
        run: python -m py_compile automation/kaggle/pre265_bmw_tuning_upgrade_path_readonly.py
      - name: Inspect PAL BMW performance menu and helper functions
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre265_bmw_tuning_upgrade_path_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Retain bounded audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre265-bmw-upgrade-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre265/PRE265_BMW_PERFORMANCE_MENU_SAFETY.json
          retention-days: 14
          if-no-files-found: warn
