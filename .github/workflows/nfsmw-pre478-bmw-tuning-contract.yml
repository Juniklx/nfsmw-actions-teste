name: NFSMW PRE478 BMW tuning feature OFF contract and synthetic tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre478_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre478-bmw-tuning-feature-off
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and compile offline contract
        run: |
          python -m py_compile automation/kaggle/pre478_bmw_tuning_contract.py
      - name: PRE478 prove fail-closed upgrade validation using pinned reports
        run: |
          set -euo pipefail
          python automation/kaggle/pre478_bmw_tuning_contract.py --run-id "$GITHUB_RUN_ID"
      - name: Persist sanitized private test and category gate results
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre478/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          if d.get("mod_enabled",False) is not False or d.get("apk_built",False) is not False:
              raise SystemExit("PRE478 invariant violated")
          if d.get("status")!="AUDIT_OK":
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["mod_enabled"]=False
              dest=Path("docs/PRE478_BMW_TUNING_CONTRACT_DIAGNOSTIC.json")
          else:
              if d.get("ready_for_signed_APK") is not False or d.get("runtime_patch_written") is not False:
                  raise SystemExit("PRE478 fail closed")
              dest=Path("docs/PRE478_BMW_TUNING_FEATURE_OFF_CONTRACT.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE478_BMW_TUNING_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE478: persist BMW feature OFF tuning contract results"
          git push origin HEAD:main
      - name: Preserve private static contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre478-tuning-feature-off-${{ github.run_id }}
          path: /tmp/nfsmw-pre478/report.json
          if-no-files-found: warn
          retention-days: 14
