name: NFSMW PRE690 - guarded private context staging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/run_requests/PRE690_CONTEXT_*.txt'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre690-context-staged
  cancel-in-progress: false
jobs:
  context:
    name: Append PRE690 stage after exact Drive backup match
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main' && github.actor == 'Juniklx'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax preflight without secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre690_context_sync_guarded.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          echo PRE690_CONTEXT_SCRIPT_SYNTAX=PASS
      - name: Backup-gated in-place Drive context append with SHA256 readback
        shell: bash
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_REFRESH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then echo "PRE690_MISSING_SECRET_NAME=$name"; exit 2; fi
          done
          python automation/kaggle/pre690_context_sync_guarded.py
# No APK, source builds, debug signer, private log exposure or public artifact.
