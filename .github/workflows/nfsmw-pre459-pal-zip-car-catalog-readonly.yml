name: NFSMW PRE459 inventory PAL archive catalog filenames only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre459_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre459-pal-archive-contents
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google auth and check syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py
      - name: PRE459 strict byte-range read-only ZIP64 inventory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre459_pal_zip_car_catalog_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Commit filename-only inventory to private repository
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("/tmp/nfsmw-pre459/report.json").read_text())
          if data.get("status")!="AUDIT_OK" or data.get("assets_downloaded") is not False:
              raise SystemExit("PRE459 fail closed")
          target=Path("docs/PRE459_PAL_ZIP_ORIGINAL_FILE_INDEX_READONLY.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE459_PAL_ZIP_ORIGINAL_FILE_INDEX_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE459: record PAL disc file index only"
          git push origin HEAD:main
      - name: Preserve private metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre459-pal-paths-${{ github.run_id }}
          path: /tmp/nfsmw-pre459/report.json
          if-no-files-found: warn
          retention-days: 14
