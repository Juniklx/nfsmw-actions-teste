name: NFSMW PRE369 player input V44 progress context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre369_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre369-canonical-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify context script and Drive dependencies
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre369_sync_xinput_nitro_v44_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup then append PRE357–PRE365 and V44 pending with readback
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre369_sync_xinput_nitro_v44_context.py
      - name: Preserve sanitized backup and readback status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre369-context-sync-${{ github.run_id }}
          path: /tmp/nfsmw-pre369/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
      - name: Publish bounded summary in GitHub
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE369 --report /tmp/nfsmw-pre369/CONTEXT_SYNC_STATUS.json
