name: NFSMW PRE273 BMW customization TakeControl cross-check (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre273_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre273-takecontrol
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only authenticated PRE99 client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Verify script syntax
        run: python -m py_compile automation/kaggle/pre273_bmw_takecontrol_static_crosscheck.py
      - name: Cross-check PAL candidate and caller references
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre273_bmw_takecontrol_static_crosscheck.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve sanitized metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre273-bmw-takecontrol-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre273/PRE273_BMW_TAKECONTROL_CROSSCHECK.json
          retention-days: 14
          if-no-files-found: warn
