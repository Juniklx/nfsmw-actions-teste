name: NFSMW PRE409 BMW upgrade catalog read-only
on:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre409_requests/*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfsmw-pre409-bmw-catalog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Validate audit syntax
        run: python -m py_compile automation/kaggle/pre409_bmw_upgrade_catalog_readonly.py
      - name: Audit authenticated PAL sources
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: PYTHONPATH=automation/kaggle python automation/kaggle/pre409_bmw_upgrade_catalog_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre409-bmw-catalog-${{ github.run_id }}
          path: /tmp/nfsmw-pre409/report.json
          retention-days: 14
          if-no-files-found: warn
