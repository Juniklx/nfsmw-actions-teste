name: NFSMW PRE462 raw USA ISO resource reference read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre462_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre462-usa-catalog-reference
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Google auth and compile
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py
      - name: PRE462 strictly bounded USA ISO reference inventory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Record read-only metadata
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("/tmp/nfsmw-pre462/report.json").read_text())
          if data.get("status")!="AUDIT_OK" or data.get("bmw_parts_proven_compatible") is not False:
              raise SystemExit("PRE462 fail-closed")
          dst=Path("docs/PRE462_USA_REFERENCE_CATALOG_RESOURCE_METADATA.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE462_USA_REFERENCE_CATALOG_RESOURCE_METADATA.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE462: record authenticated USA ISO resource candidate reference"
          git push origin HEAD:main
      - name: Preserve audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre462-usa-resource-metadata-${{ github.run_id }}
          path: /tmp/nfsmw-pre462/report.json
          if-no-files-found: warn
          retention-days: 14
