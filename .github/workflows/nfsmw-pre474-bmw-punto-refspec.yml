name: NFSMW PRE474 inspect BMW and Punto original pvehicle RefSpecs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre474_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre474-pal-bmw-parts-refspec
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated read-only parser
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre474_bmw_punto_refs_readonly.py
      - name: PRE474 inspect legitimate original RefSpec arrays only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre474_bmw_punto_refs_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Persist structural resource metadata only
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("/tmp/nfsmw-pre474/report.json").read_text())
          if doc.get("status")!="AUDIT_OK" or doc.get("safe_to_enable_mod") is not False:
              raise SystemExit("PRE474 closed-safe gate")
          dst=Path("docs/PRE474_PAL_BMW_PUNTO_PERFORMANCE_REF_ARRAYS.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE474_PAL_BMW_PUNTO_PERFORMANCE_REF_ARRAYS.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE474: document BMW and Punto performance reference arrays"
          git push origin HEAD:main
      - name: Preserve metadata audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre474-bmw-ref-arrays-${{ github.run_id }}
          path: /tmp/nfsmw-pre474/report.json
          if-no-files-found: warn
          retention-days: 14
