name: NFSMW PRE521 verify original FE_ATTRIB frontend carparts pricing vault structures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre521_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre521-frontend-carparts-index
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated original PAL/USA ranged resource readers
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre521_original_fe_attrib_carparts_structure_readonly.py
      - name: Verify pinned ZDIR semantics and checksum candidate without changing game files
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre521_original_fe_attrib_carparts_structure_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Guard against game modifications and save sanitized metadata
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/nfsmw-pre521/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"stage":"PRE521","status":"FAILED_NO_REPORT"}
          for k in ("original_game_asset_exported","original_game_asset_modified",
                    "APK_built","save_modified","signing_material_accessed",
                    "safe_to_enable_BMW_tuning"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE521 read-only/safety flag violation: "+k)
          if d.get("status")=="AUDIT_OK":
              if d.get("guest_LOADER_and_shop_cost_runtime_confirmed") is not False:
                  raise SystemExit("Cannot promote checksum match to loader validation")
              dest=Path("docs/PRE521_USA_FE_ATTRIB_FRONTEND_CARPARTS_STRUCTURE_READONLY.json")
          else:
              dest=Path("docs/PRE521_USA_FE_ATTRIB_FRONTEND_CARPARTS_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["safe_to_enable_BMW_tuning"]=False
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE521_USA_FE_ATTRIB_FRONTEND_CARPARTS_*json
          git diff --cached --quiet && exit 0
          git commit -m "PRE521: original FE_ATTRIB structure and frontend carparts class reference inventory"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain sanitized private verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre521-zdir-semantics-${{ github.run_id }}
          path: /tmp/nfsmw-pre521/report.json
          retention-days: 14
