name: NFSMW - Sincronizar CONTEXTO canônico PRE112B (backup primeiro)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/context_sync_requests/*.json'

permissions:
  contents: write

concurrency:
  group: nfsmw-context-drive-sync
  cancel-in-progress: false

jobs:
  append-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository privado
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar API Google e verificar sintaxe
        id: setup
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -m py_compile automation/kaggle/sync_context_pre112_drive.py
      - name: Copiar contexto existente e anexar adendo PRE112B
        id: sync
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python automation/kaggle/sync_context_pre112_drive.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre112-context-sync.json
      - name: Salvar relatorio privado independente da branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre112-canonical-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre112-context-sync.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar resultado sanitizado no GitHub
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          f = Path('/tmp/nfsmw-pre112-context-sync.json')
          status = json.loads(f.read_text(encoding='utf-8')) if f.is_file() else {'status': 'SEM_RELATORIO'}
          status['run_id'] = os.environ['GITHUB_RUN_ID']
          status['run_url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          status['workflow_setup_outcome'] = os.environ['SETUP_OUTCOME']
          status['workflow_sync_outcome'] = os.environ['SYNC_OUTCOME']
          status['recorded_utc'] = datetime.now(timezone.utc).isoformat()
          p = Path('automation/kaggle/status/pre112_canonical_context_sync.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Report published with hashes and Drive backup ID, no credentials')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre112_canonical_context_sync.json
          git commit -m 'Record PRE112B canonical Drive context sync status [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Report publication retry ${attempt}"
            sleep "$((attempt * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Exigir sincronizacao validada
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: test "$SYNC_OUTCOME" = 'success'
