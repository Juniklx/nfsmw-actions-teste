name: NFSMW PRE471 PAL BMW UpgradeSpecs pointer provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre471_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre471-pal-bmw-upgrade-pointers
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare read-only inspector
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre471_pal_upgrade_pointer_fixups_readonly.py
      - name: PRE471 inspect four BMW upgrade pointers in PtrN
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre471_pal_upgrade_pointer_fixups_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save pointer metadata only
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("/tmp/nfsmw-pre471/report.json").read_text())
          if d.get("status")!="AUDIT_OK" or d.get("safe_to_enable_mod") is not False:
              raise SystemExit("PRE471 fail closed")
          dst=Path("docs/PRE471_BMW_PAL_UPGRADESPECS_PTRN_READONLY.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE471_BMW_PAL_UPGRADESPECS_PTRN_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE471: record PAL BMW UpgradeSpecs pointer fixup metadata"
          git push origin HEAD:main
      - name: Archive private metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre471-pal-bmw-upgrade-pointers-${{ github.run_id }}
          path: /tmp/nfsmw-pre471/report.json
          if-no-files-found: warn
          retention-days: 14
