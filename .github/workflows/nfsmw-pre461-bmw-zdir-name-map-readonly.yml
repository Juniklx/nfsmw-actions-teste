name: NFSMW PRE461 BMW archive hash name mapping read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre461_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre461-bmw-index-name-map
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Google auth
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre461_zdir_candidate_hash_names_readonly.py
      - name: PRE461 read-only ZDIR hash mapping against pinned public list
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre461_zdir_candidate_hash_names_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save metadata-only candidate mapping
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("/tmp/nfsmw-pre461/report.json").read_text())
          if doc.get("status")!="AUDIT_OK" or doc.get("safe_to_enable_mod") is not False:
              raise SystemExit("PRE461 fail closed")
          target=Path("docs/PRE461_BMW_ZDIR_RESOURCE_NAME_CANDIDATES.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE461_BMW_ZDIR_RESOURCE_NAME_CANDIDATES.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE461: map known filenames against 1390 PAL ZDIR hashes"
          git push origin HEAD:main
      - name: Preserve private audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre461-bmw-zdir-matches-${{ github.run_id }}
          path: /tmp/nfsmw-pre461/report.json
          if-no-files-found: warn
          retention-days: 14
