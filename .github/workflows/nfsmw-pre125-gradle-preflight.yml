name: NFSMW - PRE125 ephemeral PRE117 and permanent signature Gradle preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/preflight_pre125_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre125-gradle-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google API dependencies and validate scripts
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre104_verify_backup_tar.py automation/kaggle/pre105_read_settings_source.py automation/kaggle/pre107_restore_isolated.py automation/kaggle/pre117_one_scroll_android_dryrun.py automation/kaggle/pre118_audit_build_tree.py automation/kaggle/pre125_ephemeral_gradle_signing_preflight.py
      - name: Verify permanent certificate and ephemeral Gradle configuration
        id: preflight
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          python automation/kaggle/pre125_ephemeral_gradle_signing_preflight.py \
            --run-id "$GITHUB_RUN_ID" --report /tmp/nfsmw-pre125-report.json
      - name: Preserve sanitized GitHub report only (never signing material)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre125-signing-preflight-${{ github.run_id }}
          path: /tmp/nfsmw-pre125-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save sanitized preflight result in private repo
        if: always()
        env:
          PRE125_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import json,os
          src=Path('/tmp/nfsmw-pre125-report.json')
          data=json.loads(src.read_text(encoding='utf-8')) if src.is_file() else {'status':'SEM_RELATORIO'}
          data['workflow_preflight_outcome']=os.environ['PRE125_OUTCOME']
          data['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          dst=Path('automation/kaggle/status/pre125_gradle_signing_preflight.json')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PRE125 status record prepared; no secret values')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre125_gradle_signing_preflight.json
          git commit -m 'Record PRE125 ephemeral signing/Gradle preflight [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Gate on successful signing and Gradle preflight
        if: always()
        env:
          PRE125_OUTCOME: ${{ steps.preflight.outcome }}
        run: test "$PRE125_OUTCOME" = success
