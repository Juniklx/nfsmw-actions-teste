name: NFSMW - PRE112 C++ syntax isolated (no APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/cpp_syntax_requests/*.json'

permissions:
  contents: write

concurrency:
  group: nfsmw-pre112-cpp-syntax
  cancel-in-progress: false

jobs:
  isolated-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependencies and scripts syntax
        id: setup
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -m py_compile \
            automation/kaggle/pre104_verify_backup_tar.py \
            automation/kaggle/pre105_read_settings_source.py \
            automation/kaggle/pre107_restore_isolated.py \
            automation/kaggle/pre108_dryrun_theme_labels.py \
            automation/kaggle/pre111_dryrun_local_palette.py \
            automation/kaggle/pre112_cpp_syntax_isolated.py
      - name: Compile baseline and PRE111 copy inside temporary restored PRE99
        id: syntax
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python automation/kaggle/pre112_cpp_syntax_isolated.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre112-compile-status.json
      - name: Retain private compilation report independently of branch updates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre112-compile-report-${{ github.run_id }}
          path: /tmp/nfsmw-pre112-compile-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized PRE112 report
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('/tmp/nfsmw-pre112-compile-status.json')
          report = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'SEM_RELATORIO'}
          report['run_id'] = os.environ['GITHUB_RUN_ID']
          report['run_url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report['workflow_setup_outcome'] = os.environ['SETUP_OUTCOME']
          report['workflow_syntax_outcome'] = os.environ['SYNTAX_OUTCOME']
          report['recorded_utc'] = datetime.now(timezone.utc).isoformat()
          path = Path('automation/kaggle/status/pre112_cpp_syntax.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('PRE112 report sanitized; no code, TAR, APK or credentials archived in git')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre112_cpp_syntax.json
          git commit -m 'Record PRE112 C++ syntax-only isolated compile results [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'PRE112 status saved'
              exit 0
            fi
            echo "PRE112 publication retry ${attempt}"
            sleep "$((attempt * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Require syntax diagnostic to have run successfully
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
        run: test "$SYNTAX_OUTCOME" = 'success'
