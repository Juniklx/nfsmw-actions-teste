name: NFSMW - PRE106 read-only SettingsStyle palette audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/palette_requests/*.json'

permissions:
  contents: write

concurrency:
  group: nfsmw-pre106-palette-audit
  cancel-in-progress: false

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and syntax check
        id: setup
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -m py_compile automation/kaggle/pre104_verify_backup_tar.py automation/kaggle/pre106_find_settings_palette.py
      - name: Verify PRE99 and locate SettingsStyle palette without extraction
        id: inspect
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python automation/kaggle/pre106_find_settings_palette.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/pre106-palette-audit.json
      - name: Record sanitized result
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('/tmp/pre106-palette-audit.json')
          data = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {"status":"SEM_RELATORIO"}
          data["run_id"] = os.environ["GITHUB_RUN_ID"]
          data["run_url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data["setup_outcome"] = os.environ["SETUP_OUTCOME"]
          data["inspection_outcome"] = os.environ["INSPECT_OUTCOME"]
          data["recorded_utc"] = datetime.now(timezone.utc).isoformat()
          target = Path("automation/kaggle/status/pre106_palette_audit.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print("PRE106 report saved (no credentials or archive included)")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre106_palette_audit.json
          git commit -m 'Record PRE106 read-only SettingsStyle palette audit [skip ci]'
          git push
      - name: Require verified source
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: test "$INSPECT_OUTCOME" = 'success'
