name: NFSMW PRE332 authenticated Nitro PAL neighborhood audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre332_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre332-nitro-neighborhood
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic parser and source syntax
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre332_nitro_pal_neighborhood_readonly.py automation/kaggle/pre332_nitro_pal_neighborhood_mock.py
          PYTHONPATH=automation/kaggle python automation/kaggle/pre332_nitro_pal_neighborhood_mock.py
      - name: Install authenticated Drive dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Analyze authenticated PRE99 PAL neighborhood
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre332_nitro_pal_neighborhood_readonly.py
      - name: Preserve bounded report as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre332-pal-nitro-neighborhood-${{ github.run_id }}
          path: /tmp/nfsmw-pre332/PRE332_NITRO_NEIGHBORHOOD.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sanitized status to GitHub
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE332 --report /tmp/nfsmw-pre332/PRE332_NITRO_NEIGHBORHOOD.json
