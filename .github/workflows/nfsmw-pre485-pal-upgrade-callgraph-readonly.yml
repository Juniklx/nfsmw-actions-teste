name: NFSMW PRE485 authenticated PAL performance function-call graph
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre485_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre485-pal-guest-function-graph
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated PRE99 source archive reader
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre104_verify_backup_tar.py automation/kaggle/pre105_read_settings_source.py automation/kaggle/pre485_pal_upgrade_callgraph_candidates_readonly.py
      - name: PRE485 callgraph and upgrade-counter opcode heuristic, no guest code exported
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre485_pal_upgrade_callgraph_candidates_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Record only private metadata and failure classification
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("/tmp/nfsmw-pre485/report.json")
          doc=json.loads(path.read_text()) if path.is_file() else {"stage":"PRE485","status":"FAILED_NO_REPORT"}
          if doc.get("mod_enabled",False) is not False or doc.get("apk_built",False) is not False or doc.get("raw_generated_source_published",False) is not False:
              raise SystemExit("Fail-closed PRE485 invariant")
          if doc.get("status")=="AUDIT_OK":
              out=Path("docs/PRE485_ORIGINAL_PAL_UPGRADE_CALL_GRAPH_CANDIDATES_READONLY.json")
              if doc.get("functions_SetPackage_SetLevel_GetMaxLevel_identified") is not False:
                  raise SystemExit("Unverified semantic identification asserted")
          else:
              out=Path("docs/PRE485_UPGRADE_CALL_GRAPH_DIAGNOSTIC.json")
              doc={k:doc.get(k) for k in ("stage","status","error_type","error","run_id") if k in doc}
              doc["mod_enabled"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE485_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE485: record PAL source graph metadata for physics upgrades"
          git push origin HEAD:main
      - name: Archive private sanitized PRE485 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre485-pal-performance-code-map-${{ github.run_id }}
          path: /tmp/nfsmw-pre485/report.json
          if-no-files-found: warn
          retention-days: 14
