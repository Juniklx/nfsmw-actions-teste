name: NFSMW PRE470 compare BMW PAL optional attributes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre470_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre470-pal-bmw-optional
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Google auth and compile
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre466_usa_vlt_exports_readonly.py automation/kaggle/pre470_pal_bmw_optional_field_compare.py
      - name: PRE470 read-only BMW attributes cross-variant comparison
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre470_pal_bmw_optional_field_compare.py --run-id "$GITHUB_RUN_ID"
      - name: Persist metadata-only BMW field comparison
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("/tmp/nfsmw-pre470/report.json").read_text())
          if d.get("status")!="AUDIT_OK" or d.get("safe_to_apply_tuning") is not False:
              raise SystemExit("PRE470 fail closed")
          out=Path("docs/PRE470_PAL_BMW_OPTIONAL_FIELDS_COMPARISON_READONLY.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE470_PAL_BMW_OPTIONAL_FIELDS_COMPARISON_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE470: compare BMW race and careerstart optional attributes"
          git push origin HEAD:main
      - name: Preserve metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre470-bmw-optional-${{ github.run_id }}
          path: /tmp/nfsmw-pre470/report.json
          if-no-files-found: warn
          retention-days: 14
