name: NFSMW - PRE121 preparar patch PRE117 verificado sem alterar Kaggle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre121_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre121-verified-pre117-candidate
  cancel-in-progress: false

jobs:
  reproduce-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google API for read-only PRE99 backup retrieval
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile \
            automation/kaggle/pre104_verify_backup_tar.py \
            automation/kaggle/pre105_read_settings_source.py \
            automation/kaggle/pre117_one_scroll_android_dryrun.py \
            automation/kaggle/pre118_audit_build_tree.py \
            automation/kaggle/pre121_prepare_pre117_candidate.py
      - name: Reproduce PRE117 patch in isolated runner from SHA-verified PRE99
        id: prepare
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: \${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: \${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: \${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -e
          python automation/kaggle/pre121_prepare_pre117_candidate.py \
            --run-id "$GITHUB_RUN_ID" \
            --report /tmp/nfsmw-pre121-report.json \
            --patch /tmp/nfsmw-pre121-pre117.patch
      - name: Retain private patch and sanitized evidence as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre121-verified-pre117-\${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre121-report.json
            /tmp/nfsmw-pre121-pre117.patch
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sanitized report and verified minimal patch to private repo
        if: always()
        env:
          PRE121_PREPARE_OUTCOME: \${{ steps.prepare.outcome }}
        run: |
          set -e
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          src=Path('/tmp/nfsmw-pre121-report.json')
          d=json.loads(src.read_text(encoding='utf-8')) if src.is_file() else {'status':'SEM_RELATORIO'}
          d['workflow_prepare_outcome']=os.environ['PRE121_PREPARE_OUTCOME']
          d['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          target=Path('automation/kaggle/status/pre121_verified_pre117_candidate.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if d.get('patch_reproduced') is True and os.environ['PRE121_PREPARE_OUTCOME']=='success':
              patch=Path('/tmp/nfsmw-pre121-pre117.patch')
              if not patch.is_file():raise RuntimeError('Validated patch missing')
              dest=Path('automation/kaggle/patches/pre117_single_scroll_android_verified.patch')
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(patch,dest)
          print('PRE121 private report ready, source and secrets omitted')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre121_verified_pre117_candidate.json
          if [ -f automation/kaggle/patches/pre117_single_scroll_android_verified.patch ]; then
            git add automation/kaggle/patches/pre117_single_scroll_android_verified.patch
          fi
          git commit -m 'Record PRE121 SHA-gated PRE117 candidate and isolated evidence [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Require successful candidate reproduction
        if: always()
        env:
          PRE121_PREPARE_OUTCOME: \${{ steps.prepare.outcome }}
        run: test "$PRE121_PREPARE_OUTCOME" = success
