name: NFSMW PRE659 V51 GPU pass category and C2 timestamp source verified canonical Drive context
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre659_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre659-v51-context-append-only
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify script and install only Google Drive API runtime
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre659_sync_v51_verified_gpu_pass_category_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests
      - name: Backup original canonical context and append PRE658 verified GPU-pass mapping and real C2 times
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          python automation/kaggle/pre659_sync_v51_verified_gpu_pass_category_context.py --run-id "$GITHUB_RUN_ID"
      - name: Archive sanitized append and readback audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre659-v51-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre659/context_result.json
          if-no-files-found: warn
          retention-days: 30
