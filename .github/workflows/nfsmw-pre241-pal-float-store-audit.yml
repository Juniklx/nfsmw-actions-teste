name: NFSMW PRE241 PAL nitro and Speedbreaker float store audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre241_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre241-readonly
  cancel-in-progress: false
jobs:
  pal-float-store-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated read-only Google Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Check Python auditor syntax
        run: python -m py_compile automation/kaggle/pre241_pal_nitro_speedbreaker_stores_readonly.py
      - name: Scan authenticated PAL PPC-to-C++ stores in memory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre241_pal_nitro_speedbreaker_stores_readonly.py
      - name: Preserve JSON audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre241-pal-nitro-speedbreaker-${{ github.run_id }}
          path: /tmp/nfsmw-pre241/NFSMW_PRE241_PAL_NITRO_SPEEDBREAKER_FLOAT_STORES.json
          if-no-files-found: warn
          retention-days: 14
