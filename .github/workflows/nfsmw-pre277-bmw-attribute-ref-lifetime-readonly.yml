name: NFSMW PRE277 BMW PAL attribute reference lifetime audit (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre277_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre277-bmw-refs
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Verify auditor syntax
        run: python -m py_compile automation/kaggle/pre277_bmw_attribute_ref_lifetime_readonly.py
      - name: Audit PAL reference lifetime helper functions
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre277_bmw_attribute_ref_lifetime_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Retain bounded read-only JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre277-bmw-attribute-ref-lifetime-${{ github.run_id }}
          path: /tmp/nfsmw-pre277/PRE277_BMW_ATTRIBUTE_REF_LIFETIME_HELPERS.json
          retention-days: 14
          if-no-files-found: warn
