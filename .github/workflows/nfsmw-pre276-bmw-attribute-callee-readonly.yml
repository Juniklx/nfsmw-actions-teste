name: NFSMW PRE276 BMW attribute second-depth side effects (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre276_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre276-bmw-attribute-callees
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Validate scanner syntax
        run: python -m py_compile automation/kaggle/pre276_bmw_getmaxlevel_callee_transitive_readonly.py
      - name: Inspect four attribute callee bodies without invoking guest code
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre276_bmw_getmaxlevel_callee_transitive_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Retain sanitized audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre276-bmw-attribute-callee-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre276/PRE276_BMW_ATTRIBUTE_CALLEE_TRANSITIVE_AUDIT.json
          retention-days: 14
          if-no-files-found: warn
