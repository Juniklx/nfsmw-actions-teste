name: NFSMW PRE495 BMW original donor engine physical profiles compare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre495_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre495-bmw-engine-donor
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authenticated PAL reader
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre494_bmw_engine_scratch_refspec_relocation.py automation/kaggle/pre495_bmw_engine_original_donor_comparison.py
      - name: Compare original BMW vs careerstart engine and scratch two RefSpecs in RAM
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre495_bmw_engine_original_donor_comparison.py --run-id "$GITHUB_RUN_ID"
      - name: Persist metadata only, never game assets
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre495/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          if any(d.get(k,False) is not False for k in ("feature_enabled","apk_built","asset_files_written")):
              raise SystemExit("PRE495 safety gate failure")
          if d.get("status")=="AUDIT_OK":
              assert d.get("donor_candidate_valid_as_user_desired_power_upgrade_proven") is False
              assert d.get("PAL_upgrade_interpolator_executed") is False
              f=Path("docs/PRE495_BMW_ENGINE_ORIGINAL_DONOR_COMPARE_READONLY.json")
          else:
              f=Path("docs/PRE495_BMW_ENGINE_DONOR_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["asset_files_written"]=False
          f.parent.mkdir(parents=True,exist_ok=True)
          f.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE495_BMW_ENGINE_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE495: record original BMW donor engine torque comparison"
          git push origin HEAD:main
      - name: Archive only private sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre495-bmw-original-engine-donor-${{ github.run_id }}
          path: /tmp/nfsmw-pre495/report.json
          if-no-files-found: warn
          retention-days: 14
