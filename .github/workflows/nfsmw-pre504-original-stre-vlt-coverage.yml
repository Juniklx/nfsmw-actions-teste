name: NFSMW PRE504 original StrE name coverage for VLT collection loading
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre504_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre504-original-stre-vlt-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate independent authenticated original VPAK audit syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre504_original_stre_vlt_collection_coverage_readonly.py
      - name: PRE504 compare original StrE hashes and all VLT collection identity hashes read only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre504_original_stre_vlt_collection_coverage_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Persist metadata report only, enforce preservation of V48 and save
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre504/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          for k in ("modified_VPAK_written","ISO_modified","APK_built","save_modified","runtime_tuning_enabled"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE504 read-only safety condition violated: "+k)
          if d.get("status")=="AUDIT_OK":
              if d.get("new_loader_collection_acceptance_proven") is not False or d.get("safe_to_build_tuning_APK") is not False:
                  raise SystemExit("Cannot claim loader acceptance from StrE coverage")
              out=Path("docs/PRE504_ORIGINAL_STRE_VLT_COLLECTION_NAME_COVERAGE_READONLY.json")
          else:
              out=Path("docs/PRE504_ORIGINAL_STRE_VLT_COVERAGE_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["runtime_tuning_enabled"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE504_ORIGINAL_STRE_VLT_*json
          git diff --cached --quiet && exit 0
          git commit -m "PRE504: store original StrE versus VLT collection hash coverage metadata"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
