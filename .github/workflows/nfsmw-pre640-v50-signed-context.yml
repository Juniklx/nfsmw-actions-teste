name: NFSMW PRE640 V50 signed Drive verified canonical context checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre640_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre640-canonical-context-append-only
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated Drive connector and validate syntax
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests
          python -m py_compile automation/kaggle/pre640_sync_v50_signed_release_context.py
      - name: Safely append signed PRE638 V50 verified and phone-test pending to canonical CONTEXTO_NFSMW.md
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: python automation/kaggle/pre640_sync_v50_signed_release_context.py --run-id "$GITHUB_RUN_ID"
      - name: Save sanitized append/readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre640-context-checkpoint-${{ github.run_id }}
          path: /tmp/nfsmw-pre640/report.json
          if-no-files-found: warn
          retention-days: 30
