name: NFSMW PRE605 BMW child engine parent-link only RAM experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre605_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre605-bmw-child-parent-only-ram
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and install Drive dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre605_bmw_parent_link_only_ram.py
      - name: Rebuild PRE502 privately and adjust one parent hash in volatile memory only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre605_bmw_parent_link_only_ram.py --run-id "$GITHUB_RUN_ID"
      - name: Publish metadata only and protect original game source/phone
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre605/report.json')
          r=json.loads(p.read_text()) if p.exists() else {"stage":"PRE605","status":"FAILED_NO_REPORT"}
          for k in ('candidate_saved_as_drive_fragment','user_phone_files_modified','new_APK_built',
                    'user_save_modified','recompiled_guest_execution_tested','safe_to_apply_on_phone_proven',
                    'signing_key_accessed'):
              if r.get(k,False) is not False:raise SystemExit("PRE605 false source/runtime claim "+k)
          if r.get('status')=="AUDIT_OK":
              if r.get("new_child_parent_is_stock_BMW") is not True or r.get("BMW_engine_counter_still_one") is not True or r.get("all_other_PRE502_VPAK_bytes_unchanged") is not True:
                  raise SystemExit("PRE605 parent-only source control failed")
              target=Path('docs/PRE605_BMW_ENGINE_PARENT_ONLY_RAM_RESULT.json')
          else:
              target=Path('docs/PRE605_BMW_ENGINE_PARENT_DIAGNOSTIC.json')
              r={k:r.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in r}
          target.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE605_BMW_ENGINE_PARENT_*json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "PRE605: BMW VLT child collection parent-only RAM diagnostic"
          for n in 1 2 3 4 5;do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
