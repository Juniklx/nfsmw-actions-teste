name: NFSMW PRE476 verify real PAL BMW/Punto RefSpec targets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre476_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre476-pal-performance-reference-resolution
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare original VPAK source reader
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre474_bmw_punto_refs_readonly.py automation/kaggle/pre476_pal_performance_reference_resolution_readonly.py
      - name: PRE476 resolve class collection references and ancestry
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre476_pal_performance_reference_resolution_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Persist bounded metadata, without original game asset bytes
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/nfsmw-pre476/report.json").read_text())
          if data.get("status")!="AUDIT_OK" or data.get("safe_to_enable_tuning") is not False:
              raise SystemExit("Fail-closed PRE476")
          target=Path("docs/PRE476_PAL_BMW_PUNTO_REFERENCE_RESOLUTION_READONLY.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE476_PAL_BMW_PUNTO_REFERENCE_RESOLUTION_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE476: trace BMW and Punto performance reference relationships"
          git push origin HEAD:main
      - name: Preserve private read-only metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre476-pal-perf-reference-${{ github.run_id }}
          path: /tmp/nfsmw-pre476/report.json
          if-no-files-found: warn
          retention-days: 14
