name: NFSMW PRE625 extra passive BMW attribute logger ARM64 link NO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre625_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre625-bmw-attr-arm64-only
  cancel-in-progress: false
jobs:
  native-link:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python scripts and install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests cryptography >/dev/null
          python -m py_compile automation/kaggle/pre625_bmw_attr_host_arm64_noapk.py
          python -m py_compile automation/kaggle/pre447_bmw_lookup_route_probe_dryrun.py
      - name: Install pinned NDK CMake if required
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          NEED=()
          [ -f "$SDK/ndk/28.2.13676358/source.properties" ] || NEED+=("ndk;28.2.13676358")
          [ -x "$SDK/cmake/3.31.6/bin/cmake" ] || NEED+=("cmake;3.31.6")
          if [ "${#NEED[@]}" -gt 0 ]; then
            SDKMANAGER=""
            for q in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
              if [ -x "$q" ]; then SDKMANAGER="$q"; break; fi
            done
            test -n "$SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK" --install "${NEED[@]}" > /tmp/nfsmw-pre625-sdk.log 2>&1
            STATUS="${PIPESTATUS[1]}"
            set -o pipefail
            if [ "$STATUS" -ne 0 ]; then
              echo "PRE625 SDK setup blocked code=$STATUS"
              exit "$STATUS"
            fi
          fi
          test -x "$SDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          test -x "$SDK/cmake/3.31.6/bin/cmake"
          echo "PRE625 PINNED NDK/CMAKE READY"
      - name: Rebuild native PAL ELF with four callbacks and no APK from authenticated sources
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: PYTHONPATH=automation/kaggle python automation/kaggle/pre625_bmw_attr_host_arm64_noapk.py --run-id "$GITHUB_RUN_ID"
      - name: Persist sanitized pass/fail metadata to repo
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/nfsmw-pre625/report.json')
          j=json.loads(path.read_text()) if path.is_file() else {'stage':'PRE625','status':'FAILED_NO_REPORT'}
          if j.get('status')=='AUDIT_OK':
             ev=j.get('evidence',{})
             if not (ev.get('new_callback_exported_exactly_once') is True
                     and ev.get('previous_3_callbacks_exported_once') is True
                     and ev.get('new_guest_memory_ops_or_calls')==0
                     and j.get('APK_built') is False
                     and j.get('signing_material_accessed') is False
                     and j.get('native_build_ok') is True):
                 raise SystemExit('PRE625 original callbacks/ARM64 gate failed')
             dest=Path('docs/PRE625_BMW_HOST_ATTR_ARM64_NATIVE_LINK_RESULT.json')
             safe={k:j.get(k) for k in ('stage','status','source_archive_sha256','native_cmake_ok',
                 'native_build_ok','native_arm64_elf','evidence','APK_built','signed',
                 'save_modified','game_assets_modified','signing_material_accessed',
                 'guest_runtime_executed','tuning_enabled','run_id','utc')}
          else:
             dest=Path('docs/PRE625_BMW_HOST_ATTR_NATIVE_DIAGNOSTIC.json')
             safe={k:j.get(k) for k in ('stage','status','phase','error_type','error','run_id','utc')}
          dest.write_text(json.dumps(safe,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE625_BMW_HOST_ATTR_*json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "PRE625: verify native ARM64 callback integration without APK or signing"
          for n in 1 2 3 4 5;do
             git fetch origin main
             git rebase origin/main
             if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre625-attr-host-native-${{ github.run_id }}
          path: /tmp/nfsmw-pre625/report.json
          retention-days: 14
          if-no-files-found: warn
