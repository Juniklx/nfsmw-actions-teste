name: NFSMW PRE460 read original ZDIR index limited bytes only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre460_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre460-zdir-index-format
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and check syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre460_pal_zdir_index_format_readonly.py
      - name: PRE460 strict-range read of ZDIR.BIN only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre460_pal_zdir_index_format_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Record sanitized index observations
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/nfsmw-pre460/report.json").read_text())
          if data.get("status")!="AUDIT_OK" or data.get("assets_published") is not False:
              raise SystemExit("PRE460 fail-closed report")
          dst=Path("docs/PRE460_PAL_ZDIR_FORMAT_READONLY.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE460_PAL_ZDIR_FORMAT_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE460: record tiny ZDIR format observations only"
          git push origin HEAD:main
      - name: Preserve private read-only summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre460-zdir-format-${{ github.run_id }}
          path: /tmp/nfsmw-pre460/report.json
          if-no-files-found: warn
          retention-days: 14
