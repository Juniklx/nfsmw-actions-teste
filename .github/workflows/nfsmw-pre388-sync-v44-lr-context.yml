name: NFSMW PRE388 verified V44 LR provenance context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre388_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre388-canonical-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare source and Drive read-write client
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre388_sync_v44_nitro_lr_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup, append PRE374-387 evidence and read back
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre388_sync_v44_nitro_lr_context.py
      - name: Preserve bounded context sync proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre388-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre388/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
      - name: Publish sanitized status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE388 --report /tmp/nfsmw-pre388/CONTEXT_SYNC_STATUS.json
