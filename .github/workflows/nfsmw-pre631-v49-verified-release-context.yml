name: NFSMW PRE631 BMW native ARM64 approved V49 running context checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre631_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre631-v49-signed-verified-context
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare guarded canonical Drive writer
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre631_sync_pre625_arm64_pass_v49_running_context_safe.py
      - name: Verify Drive V49 MD5, backup canonical context and append signed release checkpoint
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre631_sync_pre625_arm64_pass_v49_running_context_safe.py --run-id "$GITHUB_RUN_ID"
      - name: Publish only sanitized canonical status and fail on mismatch
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/nfsmw-pre631/report.json')
          d=json.loads(p.read_text()) if p.exists() else {"stage":"PRE631","status":"FAILED_NO_REPORT"}
          for k in ('APK_built','game_assets_modified','save_modified','signing_material_accessed','BMW_tuning_enabled'):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE631 forbidden output: "+k)
          if d.get('status') not in ('AUDIT_OK','ALREADY_APPLIED_VERIFIED'):
              out=Path('docs/PRE631_CANONICAL_CONTEXT_SYNC_DIAGNOSTIC.json')
              d={k:d.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in d}
          else:
              if (d.get('original_context_sha256') != 'b2e6d3ead5a123dc69a0d9a1a7fa43565cbd8fb976503714d38d79683441704f'
                  or d.get('original_context_bytes')!=965210
                  or d.get('prior_context_prefix_preserved') is not True
                  or d.get('new_handoff_readback_verified') is not True
                  or d.get('apk_drive_md5_verified') is not True):
                  raise SystemExit("PRE631 canonical bytewise verification missing")
              out=Path('docs/PRE631_CANONICAL_CONTEXT_SYNC_RESULT.json')
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE631_CANONICAL_CONTEXT_SYNC_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE631: verified PRE626 V49 release with canonical backup and readback with backup and readback"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain metadata-only write report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre631-canonical-context
          path: /tmp/nfsmw-pre631/report.json
          retention-days: 14
