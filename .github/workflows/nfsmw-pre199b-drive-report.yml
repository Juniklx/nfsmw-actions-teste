name: NFSMW PRE199B - persist verified read-only audit report in Drive
on:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre199b_drive_requests/*.json'
permissions:
  contents: read
  actions: read
jobs:
  preserve-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download successful PRE199B artifact only
        uses: actions/download-artifact@v4
        with:
          name: nfsmw-pre199b-cheats-readonly-42232418825
          path: /tmp/nfsmw-pre199b-report
          github-token: ${{ github.token }}
          repository: Juniklx/nfsmw-actions-teste
          run-id: 42232418825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Drive uploader dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
      - name: Validate authenticated report and create new Drive report
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          f=pathlib.Path('/tmp/nfsmw-pre199b-report/PRE199B_REPORT.json')
          if f.stat().st_size>500000:
              raise ValueError('Unexpected report size')
          x=json.loads(f.read_text(encoding='utf-8'))
          assert x['phase']=='PRE199B_READ_ONLY'
          assert x['run_id']=='42232418825'
          assert x['status']=='AUDIT_OK'
          assert x['backup_sha256_valid'] is True
          assert x['source_pins_valid'] is True
          assert x['game_files_modified'] is False
          assert x['apk_compiled'] is False
          assert x['release_signer_accessed'] is False
          cred=Credentials(token=None,refresh_token=os.environ['GOOGLE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['GOOGLE_CLIENT_ID'],
              client_secret=os.environ['GOOGLE_CLIENT_SECRET'])
          cred.refresh(Request())
          drive=build('drive','v3',credentials=cred,cache_discovery=False)
          name='NFSMW_PRE199B_CHEATS_READONLY_42232418825.json'
          response=drive.files().create(
              body={'name':name,'parents':['1yw1Z83O0d83CoQccjYREYfhxAF17eHD-']},
              media_body=MediaFileUpload(str(f),mimetype='application/json',resumable=False),
              fields='id,name,size',supportsAllDrives=True).execute()
          assert response['name']==name and int(response['size'])==f.stat().st_size
          print('PRE199B_DRIVE_REPORT_ID',response['id'])
          print('PRE199B_DRIVE_REPORT_BYTES',response['size'])
          PY
