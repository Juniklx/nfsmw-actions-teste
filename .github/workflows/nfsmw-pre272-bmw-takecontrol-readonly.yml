name: NFSMW PRE272 BMW customization initialization locator (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre272_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre272-bmw-init
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Verify auditor syntax
        run: python -m py_compile automation/kaggle/pre272_bmw_takecontrol_candidate_readonly.py
      - name: Locate PAL customization-entry guest functions
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre272_bmw_takecontrol_candidate_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Archive bounded candidate metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre272-bmw-takecontrol-candidates-${{ github.run_id }}
          path: /tmp/nfsmw-pre272/PRE272_BMW_TAKECONTROL_PAL_CANDIDATES.json
          retention-days: 14
          if-no-files-found: warn
