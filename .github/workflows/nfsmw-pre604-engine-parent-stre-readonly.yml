name: NFSMW PRE604 original derived engine StrE and BMW parent audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre604_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre604-original-engine-parent-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare verified VPAK read-only source inspection
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre604_original_engine_parent_stre_control_readonly.py
      - name: Inspect Punto original derived engine, BMW cloned header, and original StrE evidence
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre604_original_engine_parent_stre_control_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Publish metadata only and preserve runtime uncertainty
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/nfsmw-pre604/report.json')
          r=json.loads(p.read_text()) if p.exists() else {"stage":"PRE604","status":"FAILED_NO_REPORT"}
          for k in ("guest_executed","game_assets_modified","save_modified","APK_built","signing_accessed"):
              if r.get(k,False) is not False:raise SystemExit("PRE604 modified device/game")
          if r.get("status")=="AUDIT_OK":
              for key in ("original_Punto_second_engine_absent_StrE",
                          "Punto_second_engine_parent_is_Punto_stock",
                          "candidate_parent_is_default",
                          "candidate_parent_linkage_differs_from_original_Punto_derived_convention"):
                  if r.get(key) is not True:raise SystemExit("PRE604 structural proof missing "+key)
              if r.get("candidate_BMW_parent_causes_corrupted_save_proven") is not False:
                  raise SystemExit("PRE604 unsupported cause assertion")
              dest=Path("docs/PRE604_BMW_PARENT_ORIGINAL_PUNTO_STRE_READONLY.json")
          else:
              dest=Path("docs/PRE604_BMW_PARENT_STRE_DIAGNOSTIC.json")
              r={k:r.get(k) for k in ("stage","status","error_type","error","run_id","utc") if k in r}
          dest.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE604_BMW_PARENT_*json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "PRE604: original Punto missing StrE but derived engine links and BMW parent hypothesis"
          for n in 1 2 3 4 5;do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Retain metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre604-engine-parent-and-stre-audit
          path: /tmp/nfsmw-pre604/report.json
          retention-days: 14
