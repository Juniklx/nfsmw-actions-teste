name: NFSMW PRE494 BMW engine in-RAM RefSpec relocation proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre494_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre494-engine-scratch
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax and authenticated Drive reader requirements
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre494_bmw_engine_scratch_refspec_relocation.py
      - name: Test duplicated stock RefSpec relocation in RAM without disk writes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre494_bmw_engine_scratch_refspec_relocation.py --run-id "$GITHUB_RUN_ID"
      - name: Record sanitized source metadata only
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=Path("/tmp/nfsmw-pre494/report.json")
          d=json.loads(report.read_text()) if report.is_file() else {"status":"FAILED_NO_REPORT"}
          if any(d.get(k,False) is not False for k in ("feature_enabled","apk_built","modified_game_binary_written","game_asset_published")):
              raise SystemExit("PRE494 mutation gate violated")
          if d.get("status")=="AUDIT_OK":
              assert d.get("scratch_second_ref_is_duplicate_stock") is True
              assert d.get("pal_engine_loader_acceptance_tested") is False
              path=Path("docs/PRE494_BMW_ENGINE_IN_MEMORY_REFSPEC_RELOCATION.json")
          else:
              path=Path("docs/PRE494_BMW_ENGINE_IN_MEMORY_RELOCATION_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["modified_game_binary_written"]=False
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE494_BMW_ENGINE_IN_MEMORY_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE494: original BMW stock RefSpec scratch-relocation report"
          git push origin HEAD:main
      - name: Archive only sanitized metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre494-engine-scratch-${{ github.run_id }}
          path: /tmp/nfsmw-pre494/report.json
          if-no-files-found: warn
          retention-days: 14
