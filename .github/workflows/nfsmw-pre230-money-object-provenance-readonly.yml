name: NFSMW PRE230 USA money field pointer provenance read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre230_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre230-money-object-provenance
  cancel-in-progress: false
jobs:
  codegen-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google Drive client
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve SHA-pinned PRE230 money pointer-chain auditor from Drive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          svc=build("drive","v3",credentials=c,cache_discovery=False)
          buf=io.BytesIO();dl=MediaIoBaseDownload(buf,svc.files().get_media(fileId="1XUtFjacEbxWI5eGH684hzLd7lpdWR4V2"))
          done=False
          while not done:_,done=dl.next_chunk()
          data=buf.getvalue()
          if hashlib.sha256(data).hexdigest()!="c3f8cc54f6d5ee5596a7730d6058a377f63df6b2731f25bfda4cafe7ad2af388":
            raise ValueError("Pinned PRE230 script digest mismatch")
          Path("/tmp/nfsmw_pre230_money_object_provenance_readonly.py").write_bytes(data)
          print("PRE230_SCRIPT_SHA_OK")
          PY
          python -m py_compile /tmp/nfsmw_pre230_money_object_provenance_readonly.py
      - name: Trace authenticated USA CXX money pointer paths, read-only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp:automation/kaggle python /tmp/nfsmw_pre230_money_object_provenance_readonly.py
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre230-money-object-${{ github.run_id }}
          path: /tmp/nfsmw-pre230/NFSMW_PRE230_USA_MONEY_OBJECT_PROVENANCE.json
          if-no-files-found: warn
          retention-days: 14
