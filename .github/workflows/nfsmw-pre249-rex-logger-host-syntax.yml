name: NFSMW PRE249 Rex SDK logging header compile probe no Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre249_requests/*.json'
permissions:
  contents: read
jobs:
  host-syntax-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated read-only source client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Python syntax check
        run: python -m py_compile automation/kaggle/pre249_rex_logging_header_host_syntax.py
      - name: Verify real pinned Rex SDK header and syntax-only compile both modules
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre249_rex_logging_header_host_syntax.py
      - name: Upload bounded private SDK ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre249-rex-sdk-probe-${{ github.run_id }}
          path: /tmp/nfsmw-pre249/NFSMW_PRE249_REAL_REX_LOGGER_HEADER_PROBE.json
          if-no-files-found: warn
          retention-days: 14
