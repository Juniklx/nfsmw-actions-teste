name: NFSMW PRE154 - V31 Vulkan source provenance audit
on:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre154_source_requests/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Drive client and validate script syntax
        run: |
          python -m py_compile automation/kaggle/pre154_audit_v31_presenter_source.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Verify PRE99 source and extract only targeted Vulkan audit excerpts
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python automation/kaggle/pre154_audit_v31_presenter_source.py
      - name: Preserve sanitized PRE154 audit report privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre154-source-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre154-source-audit.json
          if-no-files-found: warn
          retention-days: 30
