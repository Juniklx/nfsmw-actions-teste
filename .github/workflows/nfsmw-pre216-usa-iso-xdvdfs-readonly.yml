name: NFSMW PRE216 USA ISO XDVDFS identity audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre216_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre216-usa-iso-readonly
  cancel-in-progress: false
jobs:
  range-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Drive reader dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Retrieve SHA-pinned readonly ISO reader scripts
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,hashlib
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          c=Credentials(token=None,refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
            token_uri="https://oauth2.googleapis.com/token",
            client_id=os.environ["GOOGLE_CLIENT_ID"],
            client_secret=os.environ["GOOGLE_CLIENT_SECRET"])
          c.refresh(Request())
          service=build("drive","v3",credentials=c,cache_discovery=False)
          for file_id,path,expected in [
            ("1aCH8blJIr6B0ih2rsfYS8VbFesUSQ1Pn","nfsmw_pre212_drive_zip_central_directory_readonly.py","d3efcd6258ecee92449e48238e79c10eed1cabe6844eabdaa3da0718a1a0539c"),
            ("1GgjMLCcgLaZzgufx0toliMWZtc9SUOWM","nfsmw_pre213_pal_xex_header_range_readonly.py","2b13663621158dc4deebfc324e6a7aa4018aa90d9546b2658374393f4b2292bf"),
            ("1xvWDwH-U_71nGzL_Y6DNSfLYaJu6y-Gh","nfsmw_pre216_usa_iso_xdvdfs_probe_readonly.py","7280d4685d1afcfea2f58ac0522149f326dff6d145e6ae0663f1bdaa8edeade2"),
          ]:
            buf=io.BytesIO()
            dl=MediaIoBaseDownload(buf,service.files().get_media(fileId=file_id))
            done=False
            while not done:
              _,done=dl.next_chunk()
            data=buf.getvalue()
            actual=hashlib.sha256(data).hexdigest()
            if actual!=expected:raise ValueError("Pinned script SHA mismatch: "+path)
            Path("/tmp",path).write_bytes(data)
            print("PRE215_SCRIPT_SHA_OK",path)
          PY
          python -m py_compile /tmp/nfsmw_pre212_drive_zip_central_directory_readonly.py /tmp/nfsmw_pre213_pal_xex_header_range_readonly.py /tmp/nfsmw_pre216_usa_iso_xdvdfs_probe_readonly.py
      - name: Probe USA ISO filesystem and verify isolated default.xex
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp python /tmp/nfsmw_pre216_usa_iso_xdvdfs_probe_readonly.py
      - name: Upload JSON report only (no game data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre216-usa-xex-id-${{ github.run_id }}
          path: /tmp/nfsmw-pre216/NFSMW_PRE216_ISO_USA_XDVDFS_IDENTITY.json
          if-no-files-found: warn
          retention-days: 14
