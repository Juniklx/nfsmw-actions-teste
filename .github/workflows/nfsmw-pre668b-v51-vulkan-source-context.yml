name: NFSMW PRE668B verified Vulkan source canonical Drive context
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre668b_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre668b-v51-gpu-context
  cancel-in-progress: false
jobs:
  update-context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate reproducible audit script syntax and Drive API requirements
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre668b_sync_vulkan_source_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests
      - name: Validate PRE668 ZIP CRC SHA, back up and append canonical context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          python automation/kaggle/pre668b_sync_vulkan_source_context.py
      - name: Archive evidence of canonical backup and readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre668b-gpu-canonical-context
          path: /tmp/nfsmw-pre668b/report.json
          if-no-files-found: warn
          retention-days: 30
