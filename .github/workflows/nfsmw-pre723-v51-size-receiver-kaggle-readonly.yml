name: NFSMW PRE723 - V51 size receiver lineage Kaggle READONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre723_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre723-kaggle-readonly
  cancel-in-progress: false
jobs:
  kaggle-v51-presenter-audit:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local syntax and synthetic gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py automation/kaggle/pre704_generate_private_v51_kernel.py automation/kaggle/pre723_generate_private_v51_kernel.py
          python automation/kaggle/pre704_generate_private_v51_kernel.py --self-test
          python automation/kaggle/pre723_generate_private_v51_kernel.py --self-test
      - name: Prepare only Google API and Kaggle CLI libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests zstandard kaggle six >/dev/null
      - name: Authenticate V51 source recipe without APK build
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          test -n "$GOOGLE_REFRESH_TOKEN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          python automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre704-auth-source')
          m=json.loads((p/'manifest.json').read_text())
          assert m['stage']=='PRE704_AUTHENTICATED_V51_UI_SOURCE_BUNDLE'
          assert m['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
          assert m['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
          assert m['pre99_sha256']=='af8e82e198d00656814477fd64b8cc791fada21d937c1aa1cc583e5d37768b39'
          with zipfile.ZipFile(p/'pre704_v51_ui_sources.zip') as z:
              assert z.testzip() is None and len(z.namelist())==m['count']
          print('PRE704_SOURCE_BUNDLE_AUTHENTICATED=TRUE')
          print('PRE704_SOURCE_BUNDLE_FILES='+str(m['count']))
          PY
      - name: Prepare private isolated Kaggle V51 notebook
        run: |
          set -euo pipefail
          python automation/kaggle/pre723_generate_private_v51_kernel.py --manifest /tmp/nfsmw-pre704-auth-source/manifest.json --archive /tmp/nfsmw-pre704-auth-source/pre704_v51_ui_sources.zip --output /tmp/nfsmw-pre723-kernel --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre723-kernel')
          meta=json.loads((p/'kernel-metadata.json').read_text())
          note=json.loads((p/'pre723.ipynb').read_text())
          assert meta['id']=='juniklx/nfsmw-pre723-v51-size-receiver'
          import re
          slug=re.sub(r'[^a-z0-9]+','-',meta['title'].lower()).strip('-')
          assert meta['id']=='juniklx/'+slug
          assert meta['is_private'] and not meta['enable_gpu'] and not meta['enable_internet']
          assert len(note['cells'])==2
          source=''.join(note['cells'][1]['source'])
          compile(source, '<PRE723 Kaggle notebook>', 'exec')
          for secret in ('GOOGLE_REFRESH_TOKEN','GOOGLE_CLIENT_SECRET','KAGGLE_API_TOKEN','NFSMW_ASSINATURA_PERMANENTE'):
              assert secret not in source
          print('PRE723_KAGGLE_PRIVATE_NOTEBOOK_PREFLIGHT=PASS')
          PY
      - name: Start Kaggle isolated notebook, never original juniklx/nfsmw
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels push -p /tmp/nfsmw-pre723-kernel
      - name: Poll Kaggle and validate PRE723 hashed size-receiver lineage
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path
          kernel='juniklx/nfsmw-pre723-v51-size-receiver'
          out=Path('/tmp/nfsmw-pre723-result')
          out.mkdir(parents=True,exist_ok=True)
          deadline=time.monotonic()+3400
          last=''
          errors=0
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',kernel],
                  capture_output=True,text=True,timeout=90)
              if p.returncode:
                  errors+=1
                  if errors>=10:raise RuntimeError('PRE723_KAGGLE_STATUS_UNREADABLE')
                  time.sleep(15)
                  continue
              errors=0
              m=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+' '+p.stderr)
              state=m.group(1) if m else 'UNKNOWN'
              if state!=last:
                  print('PRE723_REMOTE_STATE='+state,flush=True)
                  last=state
              if state in ('ERROR','FAILED','CANCELLED','CANCELED'):
                  raise RuntimeError('PRE723_KAGGLE_EXECUTION_FAILED')
              if state=='COMPLETE':
                  got=subprocess.run(['kaggle','kernels','output',kernel,'-p',str(out),'-o'],
                         capture_output=True,text=True,timeout=180)
                  if got.returncode==0:
                      for fp in out.rglob('NFSMW_PRE723_KAGGLE_REMOTE.json'):
                          d=json.loads(fp.read_text(encoding='utf-8'))
                          if d.get('github_run_id')!=os.environ['GITHUB_RUN_ID'] or d.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']:
                              continue
                          assert d['stage']=='PRE723_V51_KAGGLE_SIZE_RECEIVER_READONLY'
                          assert d['status']=='PASS_PRE723_V51_SIZE_RECEIVER_AUDIT',d.get('status')
                          assert d['analysis_type']=='PRE723_AUTHENTICATED_V51_SIZE_RECEIVER_LEXICAL'
                          assert d['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
                          assert d['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
                          assert d['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          assert d['source_or_apk_modified'] is False
                          assert d['signing_material_accessed'] is False
                          assert d['fps_gain_proven'] is False
                          audit=d['pre723_size_receiver_identity_audit']
                          assert audit['stage']=='PRE723_V51_LINE355_SIZE_RECEIVER_VS_POINTER501_READONLY'
                          assert audit['authenticated_v51_source_inherited'] is True
                          assert audit['real_cpp_ast_used'] is False
                          assert audit['runtime_vulkan_audited'] is False
                          assert audit['source_signed_elf_equivalence']=='UNVERIFIED'
                          assert audit['stale_pointer_bug_proven'] is False
                          assert audit['extension_count_mismatch_proven'] is False
                          assert audit['apk_modified'] is False
                          assert audit['apk_built'] is False
                          assert audit['signing_material_accessed'] is False
                          assert audit['fps_gain_proven'] is False
                          assert audit['source_text_exported'] is False
                          f=audit['source_findings']
                          assert f['complete'] is True
                          assert f['line355_size_is_direct_assignment_rhs'] is True
                          assert f['line355_size_receiver_candidates']==1
                          assert f['line355_argument_assignment_candidates']==1
                          assert f['line535_arg_parent_sha256_matches'] is True
                          assert f['line501_pointer_source_sha256']=='f996732e4a7287c4f12912a9aaedcff05bb02b1eda622f3cf2f980c9466a62c2'
                          assert f['real_vulkan_extension_count_or_pointer_validity']=='NOT_VERIFIED'
                          assert f['cpp_ast_or_cfg_semantics']=='NOT_VERIFIED'
                          assert f['stale_pointer_bug_proven'] is False
                          assert f['extension_count_mismatch_proven'] is False
                          assert f['source_text_exported'] is False
                          assert f['private_identifiers_exported'] is False
                          (out/'PRE723_V51_KAGGLE_VALIDATED_SUMMARY.json').write_text(
                             json.dumps(d,indent=2,sort_keys=True)+'\n')
                          print('PRE723_KAGGLE_REMOTE_VALIDATED=TRUE',flush=True)
                          print('PRE723_SIZE355_EQUALS_DATA501_RECEIVER='+str(f['line355_size_receiver_matches_pointer501']),flush=True)
                          print('PRE723_SIZE355_MUTATIONS_CANDIDATE_COUNT='+str(len(f['line356_537_mutation_candidates'])),flush=True)
                          print('PRE723_COUNT_MISMATCH_PROVEN=FALSE',flush=True)
                          raise SystemExit(0)
              time.sleep(15)
          raise TimeoutError('PRE723_REMOTE_RESULT_NOT_VERIFIED')
          PY
      - name: Archive sanitized reports, never source or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre723-kaggle-readonly-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre723-result/PRE723_V51_KAGGLE_VALIDATED_SUMMARY.json
            /tmp/nfsmw-pre723-result/NFSMW_PRE723_KAGGLE_REMOTE.json
          if-no-files-found: warn
          retention-days: 30
