name: NFSMW PRE556 backup and append verified PAL extracted-folder HostPath checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre556_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre556-canonical-drive-context
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Google Drive safe context append helper
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre556_sync_pre555_pal_extracted_folder_context_safe.py
      - name: Create verified exact backup and append PRE555 evidence to canonical context
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre556_sync_pre555_pal_extracted_folder_context_safe.py --run-id "$GITHUB_RUN_ID"
      - name: Publish context sync metadata only
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("/tmp/nfsmw-pre556/report.json")
          d=json.loads(src.read_text()) if src.exists() else {"stage":"PRE556","status":"FAILED_NO_REPORT"}
          for k in ("apk_built","save_modified","game_assets_modified"):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE556 safety boundary violation: "+k)
          if d.get("status")=="AUDIT_OK" and not (
                  d.get("backup_created") is True and
                  d.get("prior_history_bytewise_preserved") is True and
                  d.get("postupdate_readback_bytewise_verified") is True and
                  d.get("canonical_before_sha256")=="d19cedf297bf9450b938ae68f6f8b597138ef12281765e39ca40d5409e1cf4f2"):
              raise SystemExit("PRE556 canonical append lacks verified backup/readback")
          target=Path("docs/PRE556_CANONICAL_CONTEXT_SYNC_RESULT.json")
          target.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE556_CANONICAL_CONTEXT_SYNC_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE556: verify canonical context append for PAL folder HostPath evidence"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Archive only sanitized context metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre556-canonical-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre556/report.json
          retention-days: 14
