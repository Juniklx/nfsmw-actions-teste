name: NFSMW PRE742 - decimal PPC Catch-Up field candidates
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre742-catchup-fields.yml'
      - 'automation/actions_only/pre742_ppc_catchup_fields.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-private:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare private Drive client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/actions_only/pre742_ppc_catchup_fields.py
      - name: Analyze original USA generated guest source using decimal PPC offsets
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre742_ppc_catchup_fields.py --report "$RUNNER_TEMP/pre742_report.json"
          echo 'PRE742=STATIC_ANALYSIS_ONLY' >> "$GITHUB_STEP_SUMMARY"
