name: NFSMW - PRE130 inspect SDL/ImGui Android touch events from PRE99

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre130_requests/*.json'

permissions:
  contents: write

concurrency:
  group: nfsmw-pre130-ui-input-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scripts and dependencies
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre130_audit_sdl_imgui_touch.py
      - name: Audit exact PRE99 sources read-only
        id: inspect
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python automation/kaggle/pre130_audit_sdl_imgui_touch.py \
            --run-id "$GITHUB_RUN_ID" --report /tmp/pre130-sdl-imgui.json
      - name: Preserve private audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre130-sdl-imgui-audit-${{ github.run_id }}
          path: /tmp/pre130-sdl-imgui.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record private sanitized report
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path("/tmp/pre130-sdl-imgui.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"NO_REPORT"}
          d["step_outcome"]=os.environ["INSPECT_OUTCOME"]
          d["run_url"]="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          q=Path("automation/kaggle/status/pre130_sdl_imgui_touch.json")
          q.parent.mkdir(parents=True,exist_ok=True)
          q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          print("PRE130:",d.get("status"),"files",len(d.get("files",[])))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/kaggle/status/pre130_sdl_imgui_touch.json
          git commit -m 'Record PRE130 private read-only SDL ImGui touch source audit [skip ci]'
          git fetch --no-tags --depth=50 origin main
          git rebase origin/main
          for retry in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((retry * 3))"
            git fetch --no-tags --depth=50 origin main
            git rebase origin/main
          done
          exit 1
      - name: Require successful source inspection
        if: always()
        env:
          RESULT: ${{ steps.inspect.outcome }}
        run: test "$RESULT" = success
