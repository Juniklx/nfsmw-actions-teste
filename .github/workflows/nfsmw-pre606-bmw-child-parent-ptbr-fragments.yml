name: NFSMW PRE606 corrected BMW engine child parent private PTBR fragments
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre606_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre606-bmw-child-parent-private
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and authenticated streaming dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
          python -m py_compile automation/kaggle/pre606_bmw_corrected_child_parent_private.py
      - name: Reconstruct original and verify full translated archive before private upload
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre606_bmw_corrected_child_parent_private.py --run-id "$GITHUB_RUN_ID"
      - name: Publish only metadata; ensure no guest/device claims
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre606/report.json')
          r=json.loads(p.read_text()) if p.exists() else {"stage":"PRE606","status":"FAILED_NO_REPORT"}
          for k in ('phone_guest_tested','user_game_files_modified','user_save_modified','APK_modified'):
             if r.get(k,False) is not False:raise SystemExit("PRE606 false guest/device/write claim "+k)
          if r.get("status")=="AUDIT_OK":
             if r.get("candidate_VPAK_sha256")!="11c122bf9b32011fd3955498517e51f2f1f11551bc2bbd9f448201bc4ef862f3" or r.get("pre502_comparison_parent_only_4_bytes")!=[520072,520073,520074,520075] or r.get("candidate_engine_counter")!=1 or r.get("original_zip_member_fully_verified_by_stream") is not True:
                raise SystemExit("PRE606 candidate unverified")
             dest=Path('docs/PRE606_BMW_CORRECTED_PARENT_PRIVATE_PTBR_METADATA.json')
          else:
             dest=Path('docs/PRE606_BMW_CORRECTED_PARENT_DIAGNOSTIC.json')
             r={k:r.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in r}
          dest.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE606_BMW_CORRECTED_PARENT_*json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "PRE606: privately staged corrected BMW child engine parent experimental fragments"
          for n in 1 2 3 4 5;do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
