name: NFSMW PRE305B macro fix synthetic compile gate (no APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre305b_canary_requests/*.json'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and C++ preprocessor gate
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre305_build_signed_v40_bmw_menu_gate_experimental.py automation/kaggle/pre305b_gate_macro_preflight.py
          python automation/kaggle/pre305b_gate_macro_preflight.py
