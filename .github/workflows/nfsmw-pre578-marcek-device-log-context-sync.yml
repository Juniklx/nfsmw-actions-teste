name: NFSMW PRE578 MARCEK device log evidence context backup-first canonical sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre578_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre578-bmw-patch-save-waiver-context
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare guarded canonical Drive writer
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre578_sync_marcek_device_log_context_safe.py
      - name: Backup and append only PRE577 MARCEK device log evidence
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre578_sync_marcek_device_log_context_safe.py --run-id "$GITHUB_RUN_ID"
      - name: Publish only sanitized canonical status and fail on mismatch
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/nfsmw-pre578/report.json')
          d=json.loads(p.read_text()) if p.exists() else {"stage":"PRE578","status":"FAILED_NO_REPORT"}
          for k in ('APK_built','game_assets_modified','save_modified','signing_material_accessed','BMW_tuning_enabled'):
              if d.get(k,False) is not False:
                  raise SystemExit("PRE578 forbidden output: "+k)
          if d.get('status') not in ('AUDIT_OK','ALREADY_APPLIED_VERIFIED'):
              out=Path('docs/PRE578_CANONICAL_CONTEXT_SYNC_DIAGNOSTIC.json')
              d={k:d.get(k) for k in ('stage','status','error_type','error','run_id','utc') if k in d}
          else:
              if (d.get('original_context_sha256') != '0f9f3293c04dc4453fb73c2144217aea7cdab1daa99dcef89bf3084b5d483f0a'
                  or d.get('original_context_bytes')!=880404
                  or d.get('prior_context_prefix_preserved') is not True
                  or d.get('new_handoff_readback_verified') is not True):
                  raise SystemExit("PRE578 canonical bytewise verification missing")
              out=Path('docs/PRE578_CANONICAL_CONTEXT_SYNC_RESULT.json')
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE578_CANONICAL_CONTEXT_SYNC_*json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE578: MARCEK device-log incident checkpoint with backup and readback"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Retain metadata-only write report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre578-canonical-context
          path: /tmp/nfsmw-pre578/report.json
          retention-days: 14
