name: NFSMW PRE397 V45 Nitro owner research context sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre397_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre397-canonical-context-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate context sync script and install Drive client
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre397_sync_pre392_pre395_v45_context.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Backup and append verified V45/PRE393/PRE395 evidence
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre397_sync_pre392_pre395_v45_context.py
      - name: Preserve bounded Drive backup readback audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre397-context-${{ github.run_id }}
          path: /tmp/nfsmw-pre397/CONTEXT_SYNC_STATUS.json
          if-no-files-found: warn
      - name: Publish sanitized context result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python automation/kaggle/pre328_publish_sanitized_audit_status.py --stage PRE397 --report /tmp/nfsmw-pre397/CONTEXT_SYNC_STATUS.json
