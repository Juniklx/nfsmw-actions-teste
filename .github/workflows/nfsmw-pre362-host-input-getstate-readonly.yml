name: NFSMW PRE362 XInput host state source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre362_requests/*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script and install Drive read dependencies
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre362_host_input_getstate_readonly.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Inspect authenticated host-side XInput implementation
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre362_host_input_getstate_readonly.py
      - name: Preserve source read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre362-host-xinput-${{ github.run_id }}
          path: /tmp/nfsmw-pre362/PRE362_HOST_INPUT_GETSTATE.json
          if-no-files-found: warn
          retention-days: 30
