name: NFSMW PRE467 authenticate original PAL ATTRIBUTES VPAK by ZIP CRC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre467_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre467-pal-attribute-identity
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated Drive stream dependencies
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre467_pal_zip4_attributes_vpak_authenticated.py
      - name: PRE467 extract only PAL attribute hash in private memory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre467_pal_zip4_attributes_vpak_authenticated.py --run-id "$GITHUB_RUN_ID"
      - name: Commit hash and format observations only
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("/tmp/nfsmw-pre467/report.json").read_text())
          if r.get("status")!="AUDIT_OK" or r.get("raw_game_assets_published") is not False:
              raise SystemExit("PRE467 invalid safety gate")
          out=Path("docs/PRE467_PAL_BMW_ATTRIBUTES_BINARY_IDENTITY.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE467_PAL_BMW_ATTRIBUTES_BINARY_IDENTITY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE467: record authenticated PAL attribute VPAK hash and identity"
          git push origin HEAD:main
      - name: Preserve metadata audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre467-pal-attribute-identity-${{ github.run_id }}
          path: /tmp/nfsmw-pre467/report.json
          if-no-files-found: warn
          retention-days: 14
