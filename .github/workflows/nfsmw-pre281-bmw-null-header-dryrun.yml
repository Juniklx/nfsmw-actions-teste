name: NFSMW PRE281 BMW null selected-part cleanup guard dry-run (no APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre281_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre281-bmw-header-guard
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PRE99 verified reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check
        run: python -m py_compile automation/kaggle/pre281_bmw_null_header_guard_dryrun.py
      - name: Test reversible, default-off null-selection branch in memory
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre281_bmw_null_header_guard_dryrun.py --run-id "$GITHUB_RUN_ID"
      - name: Archive sanitized test metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre281-bmw-null-guard-dryrun-${{ github.run_id }}
          path: /tmp/nfsmw-pre281/PRE281_BMW_NULL_HEADER_GUARD_DRYRUN.json
          retention-days: 14
          if-no-files-found: warn
