name: NFSMW PRE269 BMW GetMaxLevel call-chain audit (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre269_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre269-bmw-levels
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PRE99 authenticated reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check
        run: python -m py_compile automation/kaggle/pre269_bmw_perf_levels_trace_site_readonly.py
      - name: Examine PAL performance package count return flow
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre269_bmw_perf_levels_trace_site_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Archive sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre269-bmw-levels-readonly-${{ github.run_id }}
          path: /tmp/nfsmw-pre269/PRE269_BMW_PERFORMANCE_PACKAGE_COUNT_DATAFLOW.json
          if-no-files-found: warn
          retention-days: 14
