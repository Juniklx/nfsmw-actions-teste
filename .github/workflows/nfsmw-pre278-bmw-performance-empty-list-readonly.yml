name: NFSMW PRE278 BMW performance empty-list flow (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre278_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre278-bmw-empty-list
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Validate scanner
        run: python -m py_compile automation/kaggle/pre278_bmw_performance_empty_list_static.py
      - name: Analyze guest setup call sequence, null guards, and empty list risk
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre278_bmw_performance_empty_list_static.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve bounded static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre278-bmw-performance-empty-list-${{ github.run_id }}
          path: /tmp/nfsmw-pre278/PRE278_BMW_PERFORMANCE_EMPTY_LIST_STATIC.json
          retention-days: 14
          if-no-files-found: warn
