name: NFSMW PRE497 BMW engine stock-preserving synthetic torque endpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre497_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre497-bmw-torque-profile
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dependencies and syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre497_bmw_engine_torque_endpoint_synthetic.py
      - name: Test original BMW torque-only candidate in RAM, no game writes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre497_bmw_engine_torque_endpoint_synthetic.py --run-id "$GITHUB_RUN_ID"
      - name: Persist metadata only and keep feature disabled
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/nfsmw-pre497/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          if any(d.get(k,False) is not False for k in ("tuning_enabled","apk_built","original_game_asset_written","patched_binary_published")):
              raise SystemExit("PRE497 safety invariant failed")
          if d.get("status")=="AUDIT_OK":
              if d.get("engine_profile_finalized_for_game") is not False:
                  raise SystemExit("Synthetic profile cannot be final game tuning")
              out=Path("docs/PRE497_BMW_TORQUE_ENGINE_SYNTHETIC_ENDPOINT.json")
          else:
              out=Path("docs/PRE497_BMW_TORQUE_ENGINE_SYNTHETIC_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["tuning_enabled"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE497_BMW_TORQUE_ENGINE_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE497: record original BMW torque-only synthetic endpoint tests"
          for retry in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
