name: NFSMW PRE463 USA VPAK metadata read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre463_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre463-usa-vpak-attribute
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated ranges
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py
      - name: PRE463 parse USA VPAK format without modifying it
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save VPAK metadata summary
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("/tmp/nfsmw-pre463/report.json").read_text())
          if data.get("status")!="AUDIT_OK" or data.get("feature_enabled") is not False:
              raise SystemExit("PRE463 fail closed")
          dst=Path("docs/PRE463_USA_VPAK_STRUCTURE_READONLY.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE463_USA_VPAK_STRUCTURE_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE463: record validated USA VPAK attribute metadata"
          git push origin HEAD:main
      - name: Preserve ephemeral metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre463-usa-vpak-metadata-${{ github.run_id }}
          path: /tmp/nfsmw-pre463/report.json
          if-no-files-found: warn
          retention-days: 14
