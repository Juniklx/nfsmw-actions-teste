name: NFSMW PRE204 - guest input and hook crossrefs read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre204_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre204-game-xrefs
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Drive reader and syntax-check
        run: |
          set -e
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/kaggle/pre204_game_input_hook_xrefs_readonly.py
      - name: Authenticate PRE99 and scan generated game logic without writes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          python automation/kaggle/pre204_game_input_hook_xrefs_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve private source-analysis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre204-game-input-xrefs-${{ github.run_id }}
          path: /tmp/nfsmw-pre204-xrefs/PRE204_XREFS_READONLY.json
          retention-days: 14
          if-no-files-found: warn
