name: NFSMW PRE740 - generated guest anchor scan for Catch-Up
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre740-guest-anchors.yml'
      - 'automation/actions_only/pre740_guest_runtime_anchors.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-private-pre99:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/actions_only/pre740_guest_runtime_anchors.py
      - name: Read authenticated PRE99 source and privately report guest symbol anchors
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre740_guest_runtime_anchors.py --report "$RUNNER_TEMP/pre740_private.json"
          echo 'PRE740=READ_ONLY_NO_APK' >> "$GITHUB_STEP_SUMMARY"
