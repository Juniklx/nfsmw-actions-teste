name: NFSMW PRE500 BMW full independent engine profile scratch VPAK rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre500_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre500-bmw-engine-full-vpak
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source reader and full VPAK scratch builder syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre500_bmw_engine_full_vpak_in_ram_rebuild.py
      - name: PRE500 create independent BMW +5 pct engine collection and RefsSpec/PtrN/ExpN in RAM
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre500_bmw_engine_full_vpak_in_ram_rebuild.py --run-id "$GITHUB_RUN_ID"
      - name: Publish strictly metadata-only result, never modified VPAK
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/nfsmw-pre500/report.json")
          d=json.loads(p.read_text()) if p.is_file() else {"status":"FAILED_NO_REPORT"}
          if any(d.get(k,False) is not False for k in ("safe_to_enable_or_build_tuning","apk_built","modified_game_resource_file_written","rebuilt_asset_uploaded")):
              raise SystemExit("PRE500 did not stay strictly isolated")
          if d.get("status")=="AUDIT_OK":
              if d.get("PAL_game_loader_support_verified") is not False or d.get("new_engine_not_buyable_in_game") is not True:
                  raise SystemExit("Unexpected PRE500 live integration claim")
              out=Path("docs/PRE500_BMW_ENGINE_FULL_VPAK_SCRATCH_REBUILD.json")
          else:
              out=Path("docs/PRE500_BMW_ENGINE_FULL_VPAK_SCRATCH_DIAGNOSTIC.json")
              d={k:d.get(k) for k in ("stage","status","error_type","error","run_id") if k in d}
              d["safe_to_enable_or_build_tuning"]=False
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE500_BMW_ENGINE_FULL_VPAK_*.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE500: independently reparse synthetic BMW-only engine VPAK collection"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Archive sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre500-bmw-full-scratch-${{ github.run_id }}
          path: /tmp/nfsmw-pre500/report.json
          if-no-files-found: warn
          retention-days: 14
