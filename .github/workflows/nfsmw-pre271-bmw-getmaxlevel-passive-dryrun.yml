name: NFSMW PRE271 BMW GetMaxLevel passive logger source dry-run (no APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre271_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre271-bmw-passive-dryrun
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified read-only PRE99 reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Python syntax verification
        run: python -m py_compile automation/kaggle/pre271_bmw_getmaxlevel_passive_logger_dryrun.py
      - name: Verify three guest returns and bounded logger in memory only
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre271_bmw_getmaxlevel_passive_logger_dryrun.py --run-id "$GITHUB_RUN_ID"
      - name: Retain sanitized source-patch validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre271-bmw-getmaxlevel-passive-dryrun-${{ github.run_id }}
          path: /tmp/nfsmw-pre271/PRE271_BMW_GETMAXLEVEL_PASSIVE_DRYRUN.json
          retention-days: 14
          if-no-files-found: warn
