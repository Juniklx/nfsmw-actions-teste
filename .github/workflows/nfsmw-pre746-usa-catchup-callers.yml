name: NFSMW PRE746 - USA guest Catch-Up exact calls and singleton
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre746-usa-catchup-callers.yml'
      - 'automation/actions_only/pre746_usa_catchup_callers.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usa-source-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Drive dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/actions_only/pre746_usa_catchup_callers.py
      - name: Audit original USA guest function and direct callers (private report)
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre746_usa_catchup_callers.py --report "$RUNNER_TEMP/pre746_private.json"
          echo 'PRE746_USA_GUEST_CALL_GRAPH_ONLY_NO_BUILD_NO_APK' >> "$GITHUB_STEP_SUMMARY"
