name: NFSMW PRE466 USA VLT export schema validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre466_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre466-vlt-exports
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and check syntax
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre466_usa_vlt_exports_readonly.py
      - name: PRE466 compare export entry layouts without writing resources
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre466_usa_vlt_exports_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save sanitized export layout summary
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("/tmp/nfsmw-pre466/report.json").read_text())
          if d.get("status")!="AUDIT_OK" or d.get("bmw_upgrade_purchase_safe") is not False:
              raise SystemExit("PRE466 fail-closed")
          path=Path("docs/PRE466_BMW_USA_VLT_EXPORT_SCHEMA_READONLY.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE466_BMW_USA_VLT_EXPORT_SCHEMA_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE466: persist validated VLT export index layout"
          git push origin HEAD:main
      - name: Archive metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre466-vlt-exports-${{ github.run_id }}
          path: /tmp/nfsmw-pre466/report.json
          if-no-files-found: warn
          retention-days: 14
