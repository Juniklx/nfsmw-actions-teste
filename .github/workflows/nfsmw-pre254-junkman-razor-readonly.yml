name: NFSMW PRE254 Junkman Razor and money source discovery (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre254_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre254-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only authenticated backup client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Check syntax
        run: python -m py_compile automation/kaggle/pre254_junkman_razor_source_discovery_readonly.py
      - name: Scan authenticated PRE99 snapshot without changes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre254_junkman_razor_source_discovery_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve bounded private JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre254-junkman-razor-audit-${{ github.run_id }}
          path: /tmp/nfsmw-pre254/PRE254_JUNKMAN_RAZOR_SOURCE_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 14
