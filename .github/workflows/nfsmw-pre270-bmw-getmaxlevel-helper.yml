name: NFSMW PRE270 BMW PAL GetMaxLevel helper confirmation (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre270_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre270-bmw-helper
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated source reader
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax verification
        run: python -m py_compile automation/kaggle/pre270_bmw_getmaxlevel_helper_definition_readonly.py
      - name: Scan PAL helper and zero-package guard
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre270_bmw_getmaxlevel_helper_definition_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Archive read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre270-bmw-getmaxlevel-helper-${{ github.run_id }}
          path: /tmp/nfsmw-pre270/PRE270_BMW_GETMAXLEVEL_GUEST_HELPER_AUDIT.json
          retention-days: 14
          if-no-files-found: warn
