name: NFSMW PRE242 PAL float dataflow windows read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre242_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre242-readonly
  cancel-in-progress: false
jobs:
  float-dataflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only authenticated Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Check Python syntax
        run: python -m py_compile automation/kaggle/pre242_pal_float_dataflow_readonly.py
      - name: Audit existing PAL float stores and readback-free dataflow
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre242_pal_float_dataflow_readonly.py
      - name: Preserve private JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre242-pal-float-dataflow-${{ github.run_id }}
          path: /tmp/nfsmw-pre242/NFSMW_PRE242_PAL_FLOAT_DATAFLOW_WINDOWS.json
          if-no-files-found: warn
          retention-days: 14
