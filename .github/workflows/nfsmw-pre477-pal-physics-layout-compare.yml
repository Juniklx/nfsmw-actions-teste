name: NFSMW PRE477 validate original PAL BMW and Punto physics layouts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre477_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre477-pal-physics-layout
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency and check read-only parser
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre474_bmw_punto_refs_readonly.py automation/kaggle/pre477_pal_bmw_punto_physics_layout_compare.py
      - name: PRE477 decode physics BIN metadata for six categories, no writes
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre477_pal_bmw_punto_physics_layout_compare.py --run-id "$GITHUB_RUN_ID"
      - name: Persist sanitized diagnostic even if script fails
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("/tmp/nfsmw-pre477/report.json")
          if source.is_file():
              data=json.loads(source.read_text())
          else:
              data={"stage":"PRE477_PAL_BMW_VS_PUNTO_PHYSICS_PROFILE_LAYOUTS_READONLY",
                    "status":"FAILED_NO_REPORT","safe_to_enable_bmw_upgrade":False}
          if data.get("safe_to_enable_bmw_upgrade") is not False:
              raise SystemExit("PRE477 fail closed: mod enabled unexpectedly")
          if data.get("status")=="AUDIT_OK":
              target=Path("docs/PRE477_PAL_BMW_PUNTO_PHYSICS_LAYOUTS_READONLY.json")
          else:
              target=Path("docs/PRE477_PAL_BMW_PUNTO_PHYSICS_DIAGNOSTIC.json")
              data={k:data.get(k) for k in ("stage","status","error_type","error","run_id") if k in data}
              data["safe_to_enable_bmw_upgrade"]=False
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE477_PAL_BMW_PUNTO_PHYSICS_LAYOUTS_READONLY.json docs/PRE477_PAL_BMW_PUNTO_PHYSICS_DIAGNOSTIC.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "PRE477: map original BMW/Punto physics layout hash and scalar metadata"
          git push origin HEAD:main
      - name: Archive only private diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre477-pal-bmw-physics-headers-${{ github.run_id }}
          path: /tmp/nfsmw-pre477/report.json
          if-no-files-found: warn
          retention-days: 14
