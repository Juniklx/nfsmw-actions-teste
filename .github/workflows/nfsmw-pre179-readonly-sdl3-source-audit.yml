name: NFSMW PRE179 - source authenticated SDL WaitEvent review (read only)
on:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre179_requests/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated archive reader
        run: |
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
          python -m py_compile automation/kaggle/pre179_audit_sdl3_wait_source.py
      - name: Examine only authenticated PRE99 source
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: python automation/kaggle/pre179_audit_sdl3_wait_source.py
      - name: Upload source-only audit (no build; no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre179-sdl3-source-${{ github.run_id }}
          path: /tmp/nfsmw-pre179-sdl3-audit/PRE179_SDL3_READONLY_AUDIT.zip
          if-no-files-found: warn
          retention-days: 7
