name: NFSMW PRE741 - inspect guest PPC around catchup anchors
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre741-ppc-context.yml'
      - 'automation/actions_only/pre741_ppc_context.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare authenticated read-only client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/actions_only/pre741_ppc_context.py
      - name: Read SHA-pinned guest C++ archive and write restricted private report
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre741_ppc_context.py --report "$RUNNER_TEMP/pre741_report.json"
          echo 'PRE741=READ_ONLY_NO_PATCH_NO_APK' >> "$GITHUB_STEP_SUMMARY"
