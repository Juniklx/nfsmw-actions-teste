name: NFSMW PRE618 active PTBR archive hash read-only static safety
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre618_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre618-asset-identity-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash script and fail-closed behavior
        run: |
          set -euo pipefail
          f=automation/device/pre618_check_active_bmw_archive_readonly_shevery.sh
          sh -n "$f"
          grep -Fq 'PRE618_MODO=SOMENTE_LEITURA' "$f"
          grep -Fq 'PRE618_IDENTIDADE=PRE607_BMW_PARENT_CORRECTED_VERIFICADA' "$f"
          grep -Fq 'PRE618_IDENTIDADE=PTBR_ORIGINAL_VERIFICADA' "$f"
          grep -Fq 'PRE618_IDENTIDADE=PRE592_REFSPEC_COUNT_ZERO_VERIFICADA' "$f"
          grep -Fq 'PRE618_IDENTIDADE=DESCONHECIDA_NAO_MODIFICAR' "$f"
          grep -Fq 'f15d5da54148e0e762f65004d534092dbf3c08d12b0f8b710d6cf599235a32e2' "$f"
          grep -Fq '1ed79d0f031d400002da8db6153ee84188d717e33f093a501f7a6bdfc0e5e146' "$f"
          if grep -E '^[[:space:]]*(rm|mv|cp|dd|tee|truncate|touch|mkdir|chmod|chown|mount|umount)[[:space:]]' "$f"; then
            echo "PRE618_UNSAFE_MUTATION_COMMAND"; exit 1
          fi
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/NFS"
          printf 'INVALID_ZDIR' > "$root/NFS/ZDIR.BIN"
          printf 'INVALID_ZZDATA4' > "$root/NFS/ZZDATA4.BIN"
          cp "$root/NFS/ZDIR.BIN" "$root/orig_zdir"
          cp "$root/NFS/ZZDATA4.BIN" "$root/orig_data"
          if sh "$f" "$root" >"$root/out" 2>&1; then
            echo "PRE618_INCORRECTLY_ACCEPTED_INVALID_FILES"; exit 1
          fi
          grep -Fq 'PRE618_TAMANHOS_INESPERADOS' "$root/out"
          cmp "$root/orig_zdir" "$root/NFS/ZDIR.BIN"
          cmp "$root/orig_data" "$root/NFS/ZZDATA4.BIN"
          echo "PRE618_STATIC=AUDIT_OK"
      - name: Record static-only result
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os
          out={
            "stage":"PRE618_BMW_ASSET_IDENTITY_READONLY_STATIC",
            "status":"AUDIT_OK",
            "source_log_sha256":"dc9fc0bb08ba943ede3e7675570c1c1fb15ddb5db743cee74edda4393109de0e",
            "shell_syntax_checked":True,
            "invalid_file_sizes_rejected_without_write":True,
            "phone_hash_checked":False,
            "PRE607_active_assets_proven":False,
            "APK_modified":False,"game_modified":False,"save_modified":False,
            "signing_accessed":False,
            "run_id":os.environ.get("GITHUB_RUN_ID","")
          }
          Path('docs/PRE618_BMW_ASSET_IDENTITY_READONLY_STATIC_RESULT.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE618_BMW_ASSET_IDENTITY_READONLY_STATIC_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PRE618: validated non-mutating asset hash check for S24 FE"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
