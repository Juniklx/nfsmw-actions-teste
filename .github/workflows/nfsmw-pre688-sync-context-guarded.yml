name: NFSMW PRE688 - guarded private context sync (PRE687 inconclusive)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/run_requests/PRE688_CONTEXT_*.txt'

permissions:
  contents: read

concurrency:
  group: nfsmw-pre688-context-sync-private
  cancel-in-progress: false

jobs:
  context:
    name: Preserve private context with verified backup and no APK changes
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main' && github.actor == 'Juniklx' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script and dependencies without secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre688_context_sync_guarded.py
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          echo "PRE688_CONTEXT_SCRIPT_SYNTAX=PASS"
      - name: Backup-gated private Drive context update and SHA256 readback
        shell: bash
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in GOOGLE_REFRESH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "PRE688_CONTEXT_SECRET_NAME_MISSING=$name"
              exit 2
            fi
          done
          python automation/kaggle/pre688_context_sync_guarded.py

# Private context and receipts remain in Google Drive, never public Actions artifacts.
