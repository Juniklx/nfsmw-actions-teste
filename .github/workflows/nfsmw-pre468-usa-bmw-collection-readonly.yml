name: NFSMW PRE468 find BMW legacy VLT collection records
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre468_requests/*.json'
permissions:
  contents: write
concurrency:
  group: nfsmw-pre468-usa-collection-mapping
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and compile inspector
        run: |
          python -m pip install --disable-pip-version-check google-auth requests >/dev/null
          python -m py_compile automation/kaggle/pre459_pal_zip_car_catalog_readonly.py automation/kaggle/pre462_usa_raw_iso_attributes_readonly.py automation/kaggle/pre463_usa_vpak_attribute_metadata_readonly.py automation/kaggle/pre465_usa_bmw_vpak_inner_schema_readonly.py automation/kaggle/pre466_usa_vlt_exports_readonly.py automation/kaggle/pre468_usa_bmw_collection_map_readonly.py
      - name: PRE468 parse 2399 authenticated VLT export headers
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre468_usa_bmw_collection_map_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Save collection names and hashes metadata only
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("/tmp/nfsmw-pre468/report.json").read_text())
          if d.get("status")!="AUDIT_OK" or d.get("performance_mod_ready") is not False:
              raise SystemExit("PRE468 fail-closed")
          target=Path("docs/PRE468_USA_BMW_VLT_COLLECTION_RELATIONSHIPS_READONLY.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE468_USA_BMW_VLT_COLLECTION_RELATIONSHIPS_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m "PRE468: map USA VLT BMW collections to classes by verified hash"
          git push origin HEAD:main
      - name: Archive metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre468-vlt-bmw-collections-${{ github.run_id }}
          path: /tmp/nfsmw-pre468/report.json
          if-no-files-found: warn
          retention-days: 14
