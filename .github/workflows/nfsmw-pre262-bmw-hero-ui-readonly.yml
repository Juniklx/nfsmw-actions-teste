name: NFSMW PRE262 BMW HeroCar PAL source scan (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre262_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre262-bmw-readonly
  cancel-in-progress: false
jobs:
  pal-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only PRE99 client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests >/dev/null
      - name: Syntax check auditor
        run: python -m py_compile automation/kaggle/pre262_bmw_hero_ui_generated_readonly.py
      - name: Audit authenticated source snapshot, compile only synthetic mock
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          PYTHONPATH=automation/kaggle python automation/kaggle/pre262_bmw_hero_ui_generated_readonly.py --run-id "$GITHUB_RUN_ID"
      - name: Preserve bounded audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre262-bmw-hero-ui-readonly-${{ github.run_id }}
          path: /tmp/nfsmw-pre262/PRE262_BMW_HERO_UI_PAL_READONLY.json
          retention-days: 14
          if-no-files-found: warn
