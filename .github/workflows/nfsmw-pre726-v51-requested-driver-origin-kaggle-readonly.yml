name: NFSMW PRE726 - V51 requested-to-driver extension origin Kaggle READONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/kaggle/pre726_requests/*.json'
permissions:
  contents: read
concurrency:
  group: nfsmw-pre726-kaggle-readonly
  cancel-in-progress: false
jobs:
  kaggle-v51-presenter-audit:
    if: github.repository == 'Juniklx/nfsmw-actions-teste' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local syntax and synthetic gates
        run: |
          set -euo pipefail
          python -m py_compile automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py automation/kaggle/pre704_generate_private_v51_kernel.py automation/kaggle/pre726_generate_private_v51_kernel.py
          python automation/kaggle/pre704_generate_private_v51_kernel.py --self-test
          python automation/kaggle/pre726_generate_private_v51_kernel.py --self-test
      - name: Prepare only Google API and Kaggle CLI libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 requests zstandard kaggle six >/dev/null
      - name: Authenticate V51 source recipe without APK build
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PYTHONPATH: automation/kaggle
        run: |
          set -euo pipefail
          test -n "$GOOGLE_REFRESH_TOKEN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          python automation/kaggle/pre704_stage_authenticated_v51_from_pre696.py
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre704-auth-source')
          m=json.loads((p/'manifest.json').read_text())
          assert m['stage']=='PRE704_AUTHENTICATED_V51_UI_SOURCE_BUNDLE'
          assert m['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
          assert m['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
          assert m['pre99_sha256']=='af8e82e198d00656814477fd64b8cc791fada21d937c1aa1cc583e5d37768b39'
          with zipfile.ZipFile(p/'pre704_v51_ui_sources.zip') as z:
              assert z.testzip() is None and len(z.namelist())==m['count']
          print('PRE704_SOURCE_BUNDLE_AUTHENTICATED=TRUE')
          print('PRE704_SOURCE_BUNDLE_FILES='+str(m['count']))
          PY
      - name: Prepare private isolated Kaggle V51 notebook
        run: |
          set -euo pipefail
          python automation/kaggle/pre726_generate_private_v51_kernel.py --manifest /tmp/nfsmw-pre704-auth-source/manifest.json --archive /tmp/nfsmw-pre704-auth-source/pre704_v51_ui_sources.zip --output /tmp/nfsmw-pre726-kernel --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/nfsmw-pre726-kernel')
          meta=json.loads((p/'kernel-metadata.json').read_text())
          note=json.loads((p/'pre726.ipynb').read_text())
          assert meta['id']=='juniklx/nfsmw-pre726-v51-requested-driver-origin'
          import re
          slug=re.sub(r'[^a-z0-9]+','-',meta['title'].lower()).strip('-')
          assert meta['id']=='juniklx/'+slug
          assert meta['is_private'] and not meta['enable_gpu'] and not meta['enable_internet']
          assert len(note['cells'])==2
          source=''.join(note['cells'][1]['source'])
          compile(source, '<PRE726 Kaggle notebook>', 'exec')
          for secret in ('GOOGLE_REFRESH_TOKEN','GOOGLE_CLIENT_SECRET','KAGGLE_API_TOKEN','NFSMW_ASSINATURA_PERMANENTE'):
              assert secret not in source
          print('PRE726_KAGGLE_PRIVATE_NOTEBOOK_PREFLIGHT=PASS')
          PY
      - name: Start Kaggle isolated notebook, never original juniklx/nfsmw
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle kernels push -p /tmp/nfsmw-pre726-kernel
      - name: Poll Kaggle and verify PRE726 requested-to-driver extension origin guard
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess,time
          from pathlib import Path
          kernel='juniklx/nfsmw-pre726-v51-requested-driver-origin'
          out=Path('/tmp/nfsmw-pre726-result')
          out.mkdir(parents=True,exist_ok=True)
          deadline=time.monotonic()+3400
          last=''
          fails=0
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',kernel],
                  capture_output=True,text=True,timeout=90)
              if p.returncode:
                  fails+=1
                  if fails>=10:raise RuntimeError('PRE726_KAGGLE_STATUS_UNREADABLE')
                  time.sleep(15)
                  continue
              fails=0
              m=re.search(r'KernelWorkerStatus\.([A-Z_]+)',p.stdout+' '+p.stderr)
              state=m.group(1) if m else 'UNKNOWN'
              if state!=last:
                  print('PRE726_REMOTE_STATE='+state,flush=True)
                  last=state
              if state in ('ERROR','FAILED','CANCELLED','CANCELED'):
                  raise RuntimeError('PRE726_REMOTE_KERNEL_ERROR')
              if state=='COMPLETE':
                  got=subprocess.run(['kaggle','kernels','output',kernel,'-p',str(out),'-o'],
                         capture_output=True,text=True,timeout=180)
                  if got.returncode==0:
                      for fp in out.rglob('NFSMW_PRE726_KAGGLE_REMOTE.json'):
                          d=json.loads(fp.read_text(encoding='utf-8'))
                          if d.get('github_run_id')!=os.environ['GITHUB_RUN_ID'] or d.get('github_run_attempt')!=os.environ['GITHUB_RUN_ATTEMPT']:
                              continue
                          assert d['stage']=='PRE726_V51_KAGGLE_REQUESTED_DRIVER_ORIGIN_READONLY'
                          assert d['status']=='PASS_PRE726_V51_REQUESTED_MAP_ALIAS_ORIGIN_AUDIT',d.get('status')
                          assert d['analysis_type']=='PRE726_AUTHENTICATED_V51_REQUESTED_DRIVER_EXTENSION_ORIGIN_LEXICAL'
                          assert d['presenter_sha256']=='68998a1db81e9743197e446a5f8dacbf8d3dbcc2a51e4a7e6dac476b87d88c48'
                          assert d['backend_sha256']=='b70497df49440b469018e7ef7a0e007d39ab5df13aa979edc91f37e1d2d42385'
                          assert d['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          assert d['source_or_apk_modified'] is False
                          assert d['signing_material_accessed'] is False
                          assert d['fps_gain_proven'] is False
                          p725=d['pre725_optional_extension_name_origin_audit']['source_findings']
                          assert p725['complete'] is True
                          assert p725['argument_is_dynamic_member_cstr_syntax'] is True
                          audit=d['pre726_requested_driver_origin_audit']
                          assert audit['stage']=='PRE726_V51_REQUESTED_DRIVER_EXTENSION_ORIGIN_READONLY'
                          assert audit['source_text_exported'] is False
                          assert audit['cpp_ast_or_cfg_used'] is False
                          assert audit['runtime_vulkan_tested'] is False
                          assert audit['apk_built'] is False and audit['apk_modified'] is False
                          assert audit['signing_material_accessed'] is False and audit['fps_gain_proven'] is False
                          f=audit['source_findings']
                          for domain in ('instance','device'):
                              x=f[domain]
                              assert x['loop_header_found'] is True
                              assert x['requested_find_assignments_in_branch']==1
                              assert x['requested_find_alias_matches_emplace_cstr_receiver'] is True
                              assert x['lookup_mentions_extensionName'] is True
                              assert x['enumeration_dataflow_to_range_proven'] is False
                              assert x['runtime_advertised_extensions']=='NOT_VERIFIED'
                              assert x['runtime_enabled_extensions']=='NOT_VERIFIED'
                              assert x['cpp_ast_or_cfg']=='NOT_VERIFIED'
                              assert x['raw_cpp_exported'] is False
                              assert x['private_identifiers_exported'] is False
                          assert f['requested_find_to_emplace_link_in_both_contexts'] is True
                          assert f['source_text_exported'] is False
                          assert f['real_vulkan_extension_names_exported'] is False
                          assert f['private_identifiers_exported'] is False
                          assert f['source_to_signed_elf_equivalence']=='UNVERIFIED'
                          assert f['releases_compiled'] is False
                          assert f['apk_modified'] is False and f['signing_material_accessed'] is False
                          assert f['fps_gain_proven'] is False
                          (out/'PRE726_V51_KAGGLE_VALIDATED_SUMMARY.json').write_text(
                             json.dumps(d,indent=2,sort_keys=True)+'\n')
                          print('PRE726_KAGGLE_REMOTE_VALIDATED=TRUE',flush=True)
                          print('PRE726_REQUESTED_FIND_ALIAS_LINK=TRUE',flush=True)
                          print('PRE726_INSTANCE_DEVICE_DOMAINS_SEPARATE=TRUE',flush=True)
                          print('PRE726_ACTUAL_VULKAN_RETRY_NOT_VERIFIED=TRUE',flush=True)
                          raise SystemExit(0)
              time.sleep(15)
          raise TimeoutError('PRE726_REMOTE_RESULT_NOT_VERIFIED')
          PY
      - name: Archive sanitized reports, never source or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-pre726-kaggle-readonly-${{ github.run_id }}
          path: |
            /tmp/nfsmw-pre726-result/PRE726_V51_KAGGLE_VALIDATED_SUMMARY.json
            /tmp/nfsmw-pre726-result/NFSMW_PRE726_KAGGLE_REMOTE.json
          if-no-files-found: warn
          retention-days: 30
