name: NFSMW PRE745 - PAL/USA Catch-Up guest provenance gate
on:
  push:
    branches: [audit/pre732-catchup-readonly]
    paths:
      - '.github/workflows/nfsmw-pre745-catchup-edition-crosswalk.yml'
      - 'automation/actions_only/pre745_catchup_edition_crosswalk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x360-edition-source-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private read-only Drive client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 >/dev/null
          python -m py_compile automation/actions_only/pre745_catchup_edition_crosswalk.py
      - name: Compare PAL and USA generated source shape before any hook insertion
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=automation/kaggle:automation/actions_only python automation/actions_only/pre745_catchup_edition_crosswalk.py --report "$RUNNER_TEMP/pre745_private.json"
          echo 'PRE745_EDITION_CROSSWALK_READONLY_NO_APK' >> "$GITHUB_STEP_SUMMARY"
